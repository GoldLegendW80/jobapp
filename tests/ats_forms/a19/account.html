<!doctype html><html lang="en"><meta charset="utf-8">
<title>Create your candidate account</title><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/forms/a1/forms.css"><body>
<!-- A19: a site that asks for an account before its form: the password and the code sent by
mail stay the person's (hard rule 7), so the apply agent's lease never types into them. -->
<h1>Create your candidate account</h1>
<form id="account" aria-label="Account">
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email">
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password">
<label for="code">Code sent to your email</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code">
<button type="submit">Create account</button>
</form>
<script>
document.getElementById("account").onsubmit = async event => {
  event.preventDefault();
  await fetch("/_stub/submit/a19-account", {method: "POST", body: new FormData(event.currentTarget)});
};
</script></body></html>
