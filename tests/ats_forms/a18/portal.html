<!doctype html><html lang="en"><meta charset="utf-8"><title>Example Robotics candidate profile</title><style>body{font:16px system-ui;max-width:56rem;margin:2rem auto;padding:1rem}form{padding:1.5rem;border:1px solid #ccc;border-radius:8px;margin:1rem 0}label{display:block;margin:.8rem 0}input,textarea,button{font:inherit;padding:.5rem}input,textarea{display:block;max-width:100%;width:28rem}button{cursor:pointer}#signin{display:none}</style>
<h1>Example Robotics candidate profile</h1>
<section id="signin"><h2>Sign in to Example Portal</h2><label>E-mail<input id="login-email" type="email"></label><label>Password<input id="password" type="password"></label><button id="login">Sign in</button></section>
<main id="profile">
<form aria-label="Experience 1"><h2>Experience 1</h2><label>Full name<input name="name"></label><label>Employer<input name="employer"></label><label>Job title<input name="title" value="Site's old title"></label><label>Start date<input name="start"></label><label>Team size<input name="team" required></label><button type="submit">Save</button><p role="status"></p></form>
<form aria-label="Education 1"><h2>Education 1</h2><label>School<input name="school"></label><label>Degree<input name="degree"></label><label>End date<input name="graduation"></label><button type="submit">Save</button><p role="status"></p></form>
<form aria-label="Contact"><h2>Contact</h2><label>Phone<input name="phone" value="+33 1 00 00 00 00"></label><label>Email<input name="email" type="email" value="e2e-portal@example.org"></label><label>Open to work<input name="opentowork" type="checkbox"></label><label>Marketing consent<input name="marketing" type="checkbox"></label><label>Resume<input name="resume" type="file" accept="application/pdf"></label><button type="submit">Save</button><p role="status"></p></form>
</main><script src="portal.js"></script></html>
