<!doctype html><html lang="en"><meta charset="utf-8">
<title>Invented manual application</title><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/forms/a1/forms.css"><body><h1>Platform Engineer</h1>
<form id="application" aria-label="Application">
<label for="first_name">First name</label><input id="first_name" name="first_name">
<label for="email">Email</label><input id="email" name="email">
<div role="group" aria-label="Resume"><label for="resume">Resume</label><input id="resume" name="resume" type="file" accept="application/pdf"></div>
<div role="group" aria-label="Cover letter"><label for="letter">Cover letter</label><input id="letter" name="letter" type="file" accept="application/pdf"></div>
<button type="submit" id="submit">Submit application</button></form>
<script>
document.querySelector("form").onsubmit = async event => {
  event.preventDefault();
  const response = await fetch("/_stub/submit/a9-recovery", {method: "POST", body: new FormData(event.currentTarget)});
  if (response.ok) document.body.innerHTML = "<h1>Thank you for applying</h1>";
};
</script></body></html>
