<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Credential inputs</title></head>
<body>
<form id="login">
  <h1>Sign in to Example Robotics</h1>
  <label>Email <input type="email" name="identifier" autocomplete="username"></label>
  <input type="password" name="later" autocomplete="current-password" aria-hidden="true" tabindex="-1" style="display:none">
  <button type="button">Next</button>
</form>
<form id="others">
  <label>Secret word <input type="password" name="word"></label>
  <label>Enter the code <input type="text" inputmode="numeric" autocomplete="one-time-code"></label>
  <label>Shown password <input type="text" autocomplete="new-password"></label>
  <label>Passkey <input type="text" autocomplete="username webauthn"></label>
  <label>Password hint <input type="text" name="hint"></label>
</form>
<form id="application">
  <label>Contact email <input type="email" autocomplete="email"></label>
  <label>GitHub username <input type="text" autocomplete="username"></label>
  <select aria-label="Country"><option>France</option><option>Germany</option></select>
</form>
<script>
  // #login or #application keeps that form alone: a two step login's first page, an application.
  const only = location.hash.slice(1);
  if (only) {
    for (const form of document.querySelectorAll("form")) if (form.id !== only) form.remove();
  }
</script>
</body>
</html>
