<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Offres VIE (invented stand in)</title></head>
<body>
<header><h1>Mon Volontariat International (stand in)</h1></header>
<main>
  <form method="get" action="/offres/recherche">

    <button type="submit">Rechercher</button>
  </form>
  <h1>9 offres</h1>

  <button type="button" id="plus">Voir plus d'offres</button>

<script>

</script>
