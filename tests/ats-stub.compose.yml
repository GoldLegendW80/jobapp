# CI e2e only: stubs of the ATS posting APIs, so the board check of the profile journeys and the
# worker's sweeps never call Ashby, Greenhouse or Lever from CI.
#   docker compose -p jobapp-ci -f compose.yml -f tests/ats-stub.compose.yml up -d --build --wait
# - atsstub (tests/ats_stub.py): the api's board check, every org.
# - fakeats (api/tests/jobs/fake_ats.py, as tests/compose.j5-e2e.yml runs it): every ATS call of
#   the worker's sweeps (ATS_BASE_URL with no ATS_BASE_URL_ORG_PREFIX), so CI never reaches a
#   real ATS by configuration, whatever a spec sweeps. The "fake-" orgs of
#   web/e2e/jobs-sweep.spec.ts give every failure mode, 5,000 posting boards and unicode; any
#   other org answers 404 ("board not found"). The spec's real sweep is skipped in CI
#   (E2E_SKIP_REAL_SWEEP). Local scratch stacks and the Jetson keep their own settings.
# The api refuses ATS_BASE_URL when APP_ENV is production (app/config.py).
#
# Health checks (issue #91): `up --wait` returns when every service is healthy, and Docker runs
# the first probe of a service one whole interval after its start (5 s for db and redis, 15 s
# for the api, the worker and caddy in compose.yml), service after service down the depends_on
# chain. start_interval probes every second during start_period instead, so a scratch stack is
# up as soon as it really is; after start_period the production intervals apply again. Here
# only: compose.yml and the Jetson keep their values.
x-fast-start: &fast-start
  start_period: 30s
  start_interval: 1s

services:
  api:
    environment:
      ATS_BASE_URL: http://atsstub:8080
    depends_on:
      atsstub:
        condition: service_healthy
    healthcheck: *fast-start

  worker:
    environment:
      ATS_BASE_URL: http://fakeats:8099
      # Schedule tick every minute, 2 s board timeout, one attempt (tests only; refused in
      # production): the sweep journeys do not wait through production timers.
      TEST_FAST_TIMERS: "true"
    depends_on:
      fakeats:
        condition: service_healthy
    healthcheck: *fast-start

  caddy:
    healthcheck: *fast-start

  # Its healthcheck starts a sandboxed child (compose.yml, parser): the same probe, sooner.
  parser:
    healthcheck: *fast-start

  db:
    healthcheck: *fast-start

  redis:
    healthcheck: *fast-start

  fakeats:
    # Standard library only: the same pinned base image as atsstub.
    image: python:3.12.15-slim-trixie
    # --slow 21: fake-timeout answers after 21 s, far past the worker's board timeout (2 s here
    # with TEST_FAST_TIMERS, 20 s in production), so the journey of jobs-sweep.spec.ts sees a
    # timeout either way.
    command: ["python", "/fake/fake_ats.py", "--port", "8099", "--slow", "21"]
    volumes:
      - ./api/tests/jobs/fake_ats.py:/fake/fake_ats.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/_health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s
    mem_limit: 256m
    expose:
      - "8099"

  atsstub:
    # The api's own base image (api/Dockerfile PYTHON_IMAGE): pinned and already pulled.
    image: python:3.12.15-slim-trixie
    command: ["python", "/stub/ats_stub.py", "8080"]
    volumes:
      # Relative to the project directory, the folder of compose.yml.
      - ./tests/ats_stub.py:/stub/ats_stub.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s
    mem_limit: 64m
    expose:
      - "8080"
