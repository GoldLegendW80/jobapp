# CI e2e and scratch stacks: the journey stack's fast start settings, the base overlay of every
# journey stack (ops/local-check.sh, ci.yml, the e2e configs).
#   docker compose -p jobapp-ci -f compose.yml -f tests/ats-stub.compose.yml up -d --build --wait
# It used to also run stubs of the ATS posting APIs and of the freelance feeds; those stubs were
# deleted on 2026-10-28 with the board and feed engine (every search runs the job websites ticked
# in Find jobs alone). The file keeps its name because every journey stack names it.
#
# Health checks (issue #91): `up --wait` returns when every service is healthy, and Docker runs
# the first probe of a service one whole interval after its start (5 s for db and redis, 15 s
# for the api, the worker and caddy in compose.yml), service after service down the depends_on
# chain. start_interval probes every second during start_period instead, so a scratch stack is
# up as soon as it really is; after start_period the production intervals apply again. Here
# only: compose.yml and the Jetson keep their values. The worker gets 90 s (issue #476): under
# gate load it took about 60 s before its first health record, and a failing probe inside
# start_period does not count against its retries.
x-fast-start: &fast-start
  start_period: 30s
  start_interval: 1s

services:
  api:
    healthcheck: *fast-start

  worker:
    environment:
      # Schedule tick every minute (tests only; refused in production): the sweep journeys do
      # not wait through production timers.
      TEST_FAST_TIMERS: "true"
    # The probe is a new Python process that imports app.worker: under gate load (load average
    # about 35, four journey stacks and pytest -n 10) it took more than compose.yml's 8 s on
    # every try (issue #530, "Health check exceeded timeout (8s)" on each probe of a worker that
    # recorded its health all along), so here it gets 30 s.
    healthcheck:
      <<: *fast-start
      start_period: 90s
      timeout: 30s

  caddy:
    healthcheck: *fast-start

  # Its healthcheck starts a sandboxed child (compose.yml, parser): the same probe, sooner.
  parser:
    healthcheck: *fast-start

  db:
    healthcheck: *fast-start

  redis:
    healthcheck: *fast-start
