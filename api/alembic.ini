# Alembic configuration. The database URL is not set here: alembic/env.py reads DATABASE_URL
# through app.config, the same settings the api uses.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Revision files are named after their revision id: 0001_baseline.py, 0002_<slug>.py, ...
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
