[project]
name = "jobapp-api"
version = "0.1.0"
description = "Backend of jobapp: FastAPI, SQLAlchemy 2, Postgres"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "anthropic==1.11.0",
    "argon2-cffi==25.1.0",
    "arq==0.28.0",
    # Only the AESGCM AEAD primitive is used (app/agents/crypto.py): model credentials at rest.
    # Before any upgrade, tests/agents/test_crypto_compat.py must still read the ciphertexts that
    # 46.0.7 wrote (the format of the rows stored on the Jetson).
    # Wheels (cp311-abi3, manylinux_2_34 for aarch64 and x86_64) bundle OpenSSL 4.0.3: no Rust
    # build in the images. Since 47.0.0 that OpenSSL dies with SIGILL at import inside Docker on
    # Apple silicon with SME (the M4 Mac; reproduced with 50.0.2 on 2026-10-10), so the api and
    # worker get OPENSSL_armcap=0 there, from compose.dev.yml or compose.mac.yml, and never from
    # compose.yml: the Jetson (Cortex-A78AE, no SVE or SME) keeps hardware AES (README,
    # "Apple silicon"; tests/test_openssl_armcap.py guards it).
    "cryptography==50.0.2",
    "email-validator==2.3.0",
    "fastapi==0.142.4",
    "httpx==0.28.1",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.4",
    "tzdata==2026.5",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
agents = [
    # On upgrade recheck: app/agents/fake_backend.py imports the private
    # claude_agent_sdk._internal.message_parser.parse_message, and app/worker.py turns off the
    # `claude -v` probe that SubprocessCLITransport starts without env= (SDK facts in
    # tasks/agents/todo.md).
    "claude-agent-sdk==0.2.163",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.10",
]

[tool.uv]
package = false
# Local `uv sync` and CI install everything; the images choose: the api's `runtime` target syncs
# with --no-default-groups (no SDK, no test tools), the `worker` target adds --group agents.
default-groups = ["dev", "agents"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "ASYNC"]
ignore = []

[tool.ruff.lint.isort]
# api/alembic/ holds the migrations; the import name `alembic` is the installed library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# RUF001: the identity tests use look-alike unicode (full-width letters, en dashes) on purpose.
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Starlette 1.x prefers httpx2 for its TestClient; httpx is the pinned client of the spec.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # arq 0.28 closes its pool with redis-py's close(), deprecated for aclose() since redis 5.0.1.
    "ignore:Call to deprecated close:DeprecationWarning",
]
markers = [
    "docker: needs a local Docker daemon to start throwaway Postgres containers",
    "production_argon2: runs with the production argon2 parameters, not the cheap test ones",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
