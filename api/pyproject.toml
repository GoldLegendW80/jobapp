[project]
name = "jobapp-api"
version = "0.1.0"
description = "Backend of jobapp: FastAPI, SQLAlchemy 2, Postgres"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.4",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.4",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "ASYNC"]
ignore = []

[tool.ruff.lint.isort]
# api/alembic/ holds the migrations; the import name `alembic` is the installed library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Starlette 1.x prefers httpx2 for its TestClient; httpx is the pinned client of the spec.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = ["docker: needs a local Docker daemon to start throwaway Postgres containers"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
