[project]
name = "jobapp-api"
version = "0.1.0"
description = "Backend of jobapp: FastAPI, SQLAlchemy 2, Postgres"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "anthropic==1.11.0",
    "argon2-cffi==25.1.0",
    "arq==0.28.0",
    # Only the AESGCM AEAD primitive is used (app/agents/crypto.py): model credentials at rest.
    # Before any upgrade, tests/agents/test_crypto_compat.py must still read the ciphertexts that
    # 46.0.7 wrote (the format of the rows stored on the Jetson).
    # Wheels (cp311-abi3, manylinux_2_34 for aarch64 and x86_64) bundle OpenSSL 4.0.3: no Rust
    # build in the images. Since 47.0.0 that OpenSSL dies with SIGILL at import inside Docker on
    # Apple silicon with SME (the M4 Mac; reproduced with 50.0.2 on 2026-10-10), so the api and
    # worker get OPENSSL_armcap=0 there, from compose.dev.yml or compose.mac.yml, and never from
    # compose.yml: the Jetson (Cortex-A78AE, no SVE or SME) keeps hardware AES (README,
    # "Apple silicon"; tests/test_openssl_armcap.py guards it).
    "cryptography==50.0.2",
    "email-validator==2.3.0",
    "fastapi==0.142.4",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.6",
    # The public suffix list, bundled (mail M3, app/mail/domains.py: the registrable domain of a
    # sender, for the binding rule). Pure Python (py3-none-any, 109 kB), no dependency (its
    # `update` extra, which downloads a newer list, is never installed), MPL-2.0 like the list
    # itself. The last part of the version is the date of the snapshot: domains.SNAPSHOT_DATE
    # states it and tests/mail/test_domains.py holds the two together, so an upgrade is a
    # conscious change of the list. Checked on PyPI on 2026-10-14: no advisory.
    "publicsuffixlist==1.1.0.20261010",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.4",
    "tzdata==2026.5",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
agents = [
    # On upgrade recheck: app/agents/fake_backend.py imports the private
    # claude_agent_sdk._internal.message_parser.parse_message, and app/worker.py turns off the
    # `claude -v` probe that SubprocessCLITransport starts without env= (SDK facts in
    # tasks/agents/todo.md).
    "claude-agent-sdk==0.2.163",
]
# What the parser service reads documents with (tasks/ingestion/todo.md, Text extraction per file
# type). Installed in the `worker` image, which the `parser` service runs, and for the tests;
# never in the api image: nothing is parsed in the api. Only app/ingestion/sandbox/ imports them,
# inside the locked down child.
ingestion = [
    # Pure Python (py3-none-any), BSD-3-Clause. 6.20.1 and not the 6.20.0 of the plan: checked on
    # PyPI on 2026-10-13, 6.20.1 (2026-10-12) is a fix release whose one security change,
    # "Prevent cyclic tree handling" (#4188), is one of this module's own hostile cases, and it is
    # the first release that patches GHSA-qfv9-64jg-mh7p and GHSA-9mx8-4j7g-633p. 6.20.0 brought
    # "Limit work per stream" and "Flatten the page tree iteratively". No advisory is open
    # against 6.20.1. The parser blocks `cryptography` before importing it (sandbox/main.py), so
    # it reads RC4 protected files only: on an upgrade, tests/ingestion/parser/test_pdf_text.py
    # must still find its fallback provider.
    "pypdf==6.20.1",
    # Pure Python (py2.py3-none-any), PSF licence, no dependency: the XML of a DOCX is parsed
    # with its parser, which refuses a DTD, an entity and an external reference (G7,
    # sandbox/docx.py). 0.7.1 is the last release (2021); no advisory is open against it.
    "defusedxml==0.7.1",
    # PDFium behind ctypes (G8, sandbox/pdf_render.py): renders the pages of a PDF that are
    # scans and reads the text layer of AES protected files. Checked on PyPI and on OSV on
    # 2026-10-13: 5.14.0 (2026-10-04) is still the latest release, licence "BSD-3-Clause,
    # Apache-2.0, dependency licenses", no dependency, a py3-none wheel for
    # manylinux_2_17_aarch64 (3,719,672 bytes: the Jetson) and for macosx_13_0_arm64, no
    # advisory on either. The wheel bundles PDFium itself: after a PDFium security release,
    # take the pypdfium2 release that carries it (README, "Updating pypdfium2").
    "pypdfium2==5.14.0",
    # The HTML of a mail, sanitised against an allow list (mail M3, sandbox/mail_html.py): the
    # Python binding of the Rust library ammonia. Checked on PyPI and on OSV on 2026-10-14:
    # 0.3.7 (2026-08-23) is the latest release, MIT, no dependency, an abi3 wheel for
    # manylinux_2_17_aarch64 (859,615 bytes: the Jetson) and for macosx_11_0_arm64, no advisory
    # on either. Imported only inside the locked down child, like the three above.
    "nh3==0.3.7",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.10",
]

[tool.uv]
package = false
# Local `uv sync` and CI install everything; the images choose: the api's `runtime` target syncs
# with --no-default-groups (no SDK, no test tools, no parser library), the `worker` target adds
# --group agents and --group ingestion.
default-groups = ["dev", "agents", "ingestion"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "ASYNC"]
ignore = []

[tool.ruff.lint.isort]
# api/alembic/ holds the migrations; the import name `alembic` is the installed library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# RUF001: the identity tests use look-alike unicode (full-width letters, en dashes) on purpose.
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Starlette 1.x prefers httpx2 for its TestClient; httpx is the pinned client of the spec.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # arq 0.28 closes its pool with redis-py's close(), deprecated for aclose() since redis 5.0.1.
    "ignore:Call to deprecated close:DeprecationWarning",
]
markers = [
    "docker: needs a local Docker daemon to start throwaway Postgres containers",
    "production_argon2: runs with the production argon2 parameters, not the cheap test ones",
]

[tool.coverage.run]
source = ["app"]
branch = true
# Paths relative to api/ in the data file: the two shards and the job that combines them run in
# different folders on the Mac's CI runners (/ci/runner-<n>/_work/...), and an absolute path of
# one runner is "No source for code" on the other (issue #83, run 38066771735).
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
