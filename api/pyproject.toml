[project]
name = "jobapp-api"
version = "0.1.0"
description = "Backend of jobapp: FastAPI, SQLAlchemy 2, Postgres"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "arq==0.28.0",
    "email-validator==2.3.0",
    "fastapi==0.142.4",
    "httpx==0.28.1",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.4",
    "tzdata==2026.2",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "ASYNC"]
ignore = []

[tool.ruff.lint.isort]
# api/alembic/ holds the migrations; the import name `alembic` is the installed library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# RUF001: the identity tests use look-alike unicode (full-width letters, en dashes) on purpose.
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Starlette 1.x prefers httpx2 for its TestClient; httpx is the pinned client of the spec.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # arq 0.28 closes its pool with redis-py's close(), deprecated for aclose() since redis 5.0.1.
    "ignore:Call to deprecated close:DeprecationWarning",
]
markers = [
    "docker: needs a local Docker daemon to start throwaway Postgres containers",
    "production_argon2: runs with the production argon2 parameters, not the cheap test ones",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
