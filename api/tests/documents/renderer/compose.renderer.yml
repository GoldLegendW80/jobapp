# The stack of test_renderer_container.py: the renderer exactly as compose.yml defines it (every
# hardening key comes from there through `extends`), twice, and what stands around it.
#   RENDERER_TEST_IMAGE=jobapp-renderer:test docker compose -p jobapp-renderer-test \
#     -f api/tests/documents/renderer/compose.renderer.yml up -d --wait
#
#   renderer       the service, on `rendering` alone (internal: no way out)
#   renderer-open  the same service, also on `open`, a network with a gateway and a listener:
#                  the request interception is tested here alone, with the network open
#   client         stands where the worker stands, on both networks, with relay.py
#   listener       records every connection it gets, on `open` alone
#
# POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB must be set to anything: Compose interpolates
# the whole of compose.yml to read one service of it.

x-probe: &probe
  test: ["CMD", "python", "-I", "/renderer/server.py", "--check"]
  interval: 15s
  timeout: 8s
  start_period: 60s
  start_interval: 1s
  retries: 3

x-renderer: &renderer
  extends:
    file: ../../../../compose.yml
    service: renderer
  image: ${RENDERER_TEST_IMAGE:?the renderer image under test}
  pull_policy: never
  restart: "no"
  healthcheck: *probe

x-helper: &helper
  image: ${RENDERER_TEST_IMAGE:?the renderer image under test}
  pull_policy: never
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  volumes:
    - ./relay.py:/driver/relay.py:ro
  mem_limit: 128m

services:
  renderer: *renderer
  renderer-open:
    <<: *renderer
    networks:
      - open

  client:
    <<: *helper
    command: ["python", "-I", "-c", "import signal; signal.sigwait({signal.SIGTERM})"]
    healthcheck:
      test: ["CMD", "python", "-I", "-c", "pass"]
      interval: 15s
      start_interval: 1s
      start_period: 30s
    networks:
      - rendering
      - open

  listener:
    <<: *helper
    command: ["python", "-I", "/driver/relay.py", "listen", "8080", "8443"]
    tmpfs:
      - /tmp:size=1m
    healthcheck:
      test: ["CMD", "python", "-I", "-c", "pass"]
      interval: 15s
      start_interval: 1s
      start_period: 30s
    networks:
      - open

networks:
  rendering:
    internal: true
  open: {}
