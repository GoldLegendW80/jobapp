# Continuous delivery to the Jetson (SPEC-platform.md, Repository and automation; CONTRIBUTING.md).
#
# On demand only (issue #116, the owner's decision of 2026-10-13): nothing starts this workflow by
# itself any more. It used to follow a green CI run on main; CI no longer runs per push, and what
# is deployed is a tree that passed ops/local-check.sh on the Mac. ops/deploy-checked.sh holds
# that rule (it refuses a commit whose tree has no PASS record) and then runs
# `gh workflow run deploy.yml -f ref=<full sha>`. A dispatch typed by hand skips that check: use
# the script. The job runs on the self-hosted runner installed on the Jetson by ./deploy.sh
# runner install (labels self-hosted, jetson). The runner only connects out to GitHub; no port
# is opened. The workflow definition always comes from main: the runner's job-started hook
# (ops/runner/job-guard.sh) refuses every job that is not this file (or ops.yml, the operations
# without ssh) on refs/heads/main, run by workflow_dispatch. A dispatched hot fix branch is
# deployed as code, never as workflow.
#
# The same steps as ./deploy.sh, run on the Jetson itself, under the Jetson's deploy lock
# (flock on ~/jobapp-backups/.deploy.lock, shared with ./deploy.sh): rsync of the commit into
# ~/jobapp with .rsyncignore (the .env there is never touched), build, a database backup, the
# migrations, compose up --wait, tests/jetson_smoke.sh in quick mode, the public URL in the job
# summary. Images are built before anything restarts, so a failed build leaves the running stack
# as it was; the one exception is the browser's image (owner decision of 2026-10-14): when only it
# fails, the rest deploys without the browser, whose previous container is removed.
#
# Issue #81. The migrations run BEFORE the new code starts: ops/migrate.sh runs
# `alembic upgrade head` in a one off container of the api image just built (same env_file and
# network as the api, no published port, removed afterwards, stopped after MIGRATE_TIMEOUT_S),
# against the live database, while the containers of the previous release keep serving. New code
# never queries a schema that lacks its columns. The price is a rule on migrations: the previous
# release must run on the migrated schema (expand first, contract in a later release:
# CONTRIBUTING.md, Migrations; api/tests/test_migration_rules.py flags the obvious breaches).
#   The migration fails or times out: the deploy stops there. Nothing was restarted, the previous
#     release keeps serving, the schema is what it was (one transaction, rolled back), the files
#     and :latest tags of what ran before are put back, and the run is red.
#   The migration succeeds and `up` does not become healthy: the rollback puts back what ran
#     before and starts it again, on the MIGRATED schema. That is the same expand rule. Nothing
#     here ever downgrades the schema: going back in schema is a human decision (`alembic
#     downgrade` by hand, or the predeploy dump named in the log with ops/db.sh restore-live).
# What a rollback puts back: the images of the containers that were running (tagged :previous
# from their image ids, ops/previous.sh tag-running) and the files of ~/jobapp they ran with
# (compose.yml, Caddyfile and the rest, copied to ~/jobapp-backups/previous-tree before the sync
# and synced back).
#
# Issue #16. From the sync on (the rsync itself, the pre-migration backup and the migrations
# included), any command that fails puts the previous files and :latest tags back first (trap
# restore_previous ERR, set once the tree is saved), so ~/jobapp never stays synced to a commit
# whose images were not built or whose migrations did not apply. The trap is cleared once the new
# stack is up and healthy: a smoke that fails after that does NOT roll back, on purpose. The new
# code is up on its schema by then and going back is a decision for a human (the log names the
# predeploy dump). The failed run is red and .deployed-commit keeps the previous commit. When the
# api is not running at deploy time, jobapp-api:previous keeps an older image than the saved
# tree; the log warns about it.
#
# Issue #18. The Preflight checks the syntax of ~/jobapp/.env with ops/env_check.sh before
# anything is built: a malformed line fails the run at once with "line N: invalid (reason)",
# never the value, instead of docker compose refusing the file in the middle of the build.
#
# Security: the runner has the host Docker socket, which is root on the Jetson. Only this
# repository's deploy.yml and ops.yml from main, dispatched by an account with write access,
# reach it (the guard above); it must never run a job of a fork or of a pull request.
#
# The last step, "Verify the Jetson" (ops/jetson-verify.sh), prints the figures of the stack as
# one line, JOBAPP-VERIFY services=... result=ok|fail, and in the job summary: ops/deploy-checked.sh
# and ops/ship.sh read that line from this run's log instead of asking the Jetson over ssh (owner
# decision of 2026-10-15). It fails the run when the stack is not well.
#
# Only main's history is deployed (review of pull request 334: a second account can dispatch):
# the step "Only a commit of main" refuses a ref whose commit is not on origin/main before any
# file of the checkout runs, unless the dispatch sets allow_branch AND the ref is a branch named
# hotfix/<name> whose tip is the commit checked out.
#
# The run log of this public repository is readable by anyone, so every path of this workflow
# prints figures only: names, states, counts, exit codes, revisions, never a log line, an address
# or a response body. The full output of the migrations, the predeploy backup and the smoke is
# kept on the Jetson in $BACKUPS/logs (mode 700, outside the checkout; tests/remote_ops_test.sh
# holds the rule).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy (the workflow itself always comes from main)
        required: true
        default: main
      allow_branch:
        description: Deploy a branch that is not on main; only a branch named hotfix/<name> is accepted
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One deploy per ref at a time and a started deploy always finishes. Groups are per ref, so a
# branch dispatch never replaces a pending main deploy (GitHub keeps one pending run per group);
# deploys of different refs are serialized on the Jetson by the deploy lock.
concurrency:
  group: deploy-jetson-${{ inputs.ref || 'main' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to the Jetson
    runs-on: [self-hosted, jetson]
    timeout-minutes: 45
    env:
      TARGET: ${{ inputs.ref }}
      COMPOSE: docker compose -f compose.yml --profile tunnel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET }}
          persist-credentials: false
          clean: true
          # The whole history: the next step asks whether the commit is on main.
          fetch-depth: 0

      # Before any file of the checkout runs (header). The repository is public, so the fetch needs
      # no credential.
      - name: Only a commit of main
        env:
          ALLOW_BRANCH: ${{ inputs.allow_branch }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "ref: $sha is on main"
            exit 0
          fi
          branch="${TARGET#refs/heads/}"
          if [[ "$ALLOW_BRANCH" != "true" ]]; then
            echo "::error::refused: $sha is not on main. Only main is deployed; a hot fix is a branch hotfix/<name> dispatched with allow_branch"
            exit 1
          fi
          if [[ ! "$branch" =~ ^hotfix/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ || "$branch" == *..* ]]; then
            echo "::error::refused: allow_branch deploys a branch named hotfix/<name> only, and this ref is not one"
            exit 1
          fi
          tip="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
          if [[ "$tip" != "$sha" ]]; then
            echo "::error::refused: $sha is not the tip of the branch $branch (a tag, or the branch moved)"
            exit 1
          fi
          echo "::warning::deploying $branch at $sha, which is not on main (allow_branch)"

      - name: Preflight
        run: |
          set -euo pipefail
          # JOBAPP_DIR and BACKUP_DIR are set in the runner container by ./deploy.sh runner install.
          app="${JOBAPP_DIR:-$HOME/jobapp}"
          backups="${BACKUP_DIR:-$HOME/jobapp-backups}"
          commit="$(git rev-parse HEAD)"
          {
            echo "APP=$app"
            echo "BACKUPS=$backups"
            echo "COMMIT=$commit"
          } >> "$GITHUB_ENV"
          [[ "$(uname -m)" == "aarch64" ]] || { echo "::error::not on the Jetson"; exit 1; }
          [[ -f "$app/.env" ]] || { echo "::error::$app/.env is missing: the first deploy is ./deploy.sh from the Mac"; exit 1; }
          # Issue #18: compose must be able to read .env; each bad line is named, never printed.
          bash ops/env_check.sh "$app/.env" "$app/.env" ||
            { echo "::error::$app/.env has invalid lines (above): fix them on the Jetson, nothing was built"; exit 1; }
          echo ".env: syntax ok"
          docker info --format 'docker {{.ServerVersion}}'
          docker compose version
          free_gb="$(df -Pk "$HOME" | awk 'NR==2 {print int($4 / 1024 / 1024)}')"
          echo "disk: ${free_gb}G free"
          ((free_gb > 5)) || { echo "::error::only ${free_gb}G free on the Jetson"; exit 1; }
          echo "target: $TARGET, commit $commit ($(git log -1 --format=%s))"
          echo "previous: $(cat "$app/.deployed-commit" 2>/dev/null || echo unknown)"

      - name: Deploy under the Jetson deploy lock
        id: deploy
        run: |
          set -euo pipefail
          mkdir -p "$BACKUPS"
          exec 9>"$BACKUPS/.deploy.lock"
          echo "waiting for the deploy lock (shared with ./deploy.sh)"
          flock -w 900 9 || { echo "::error::another deploy held the lock for 15 minutes"; exit 1; }
          # The full output of the backup, the migrations and the smoke (header): readable by the
          # deploy user only, outside the checkout, kept 30 days.
          logdir="$BACKUPS/logs"
          mkdir -p "$logdir"
          chmod 700 "$logdir"
          find "$logdir" -maxdepth 1 -type f -name '*.log' -mtime +30 -delete || true

          echo "::group::what ran before: images of the running containers, files of ~/jobapp"
          tree="$BACKUPS/previous-tree"
          if [[ -f "$APP/compose.yml" ]]; then
            (cd "$APP" && COMPOSE="$COMPOSE" bash "$GITHUB_WORKSPACE/ops/previous.sh" tag-running)
          else
            echo "nothing deployed in $APP yet: no images to keep"
          fi
          bash ops/previous.sh save-tree "$APP" "$tree"
          # Issue #16: no running api means jobapp-api:previous is whatever an older deploy left.
          if [[ -f "$APP/compose.yml" && -z "$(cd "$APP" && $COMPOSE ps -q --status running api 2>/dev/null)" ]]; then
            echo "::warning::the api is not running: jobapp-api:previous is older than the saved tree, so a rollback would pair them"
          fi
          echo "::endgroup::"

          restore_previous() { # the files and :latest images of what ran before; nothing restarts
            bash "$GITHUB_WORKSPACE/ops/previous.sh" restore-tree "$tree" "$APP" ||
              echo "::warning::the previous files could not be restored: $APP holds $COMMIT"
            for img in jobapp-api jobapp-worker jobapp-caddy jobapp-renderer jobapp-browser; do
              if docker image inspect "$img:previous" >/dev/null 2>&1; then
                docker tag "$img:previous" "$img:latest"
              fi
            done
          }

          # Issue #16 (header): from the sync until the new stack is up, a failing command
          # restores the previous files and tags before the step fails; set before the rsync (the
          # tree is saved above), so a sync that fails part way is undone too. Explicit `exit 1`
          # paths below call restore_previous themselves (or rollback); an exit does not fire ERR.
          trap 'echo "::error::a deploy command failed: restoring the previous files and tags"; restore_previous' ERR

          echo "::group::sync ~/jobapp from $COMMIT"
          # deploy.sh sync_tree rules: .rsyncignore excludes .env* and .deployed-commit, so
          # --delete never removes them.
          rsync -a --delete --exclude-from=.rsyncignore ./ "$APP/"
          echo "files: $(find "$APP" -type f | wc -l)"
          echo "::endgroup::"
          cd "$APP"

          echo "::group::build (the running stack is untouched until this succeeds)"
          for svc in api worker caddy renderer; do
            start=$SECONDS
            if ! $COMPOSE --progress=plain build "$svc"; then
              # The running containers never stopped; the files and tags go back to match them.
              echo "::error::build of $svc failed: the running stack is untouched"
              restore_previous
              exit 1
            fi
            echo "build $svc: $((SECONDS - start))s"
          done
          # The browser (behind the `browser` profile) is built too; whether it starts is decided
          # after the migrations, by its host firewall (ops/browser-egress.sh, browser B6). A
          # failed build does not stop the deploy (owner decision of 2026-10-14): the rest deploys
          # without the browser, whose previous container is removed below, and it stays down until
          # a deploy builds its image again.
          browser_built=1
          start=$SECONDS
          if ! $COMPOSE --profile browser --progress=plain build browser; then
            browser_built=0
            echo "::warning::build of browser failed: everything else deploys, the browser is not deployed"
          fi
          echo "build browser: $((SECONDS - start))s"
          echo "::endgroup::"

          echo "::group::backup before migrations"
          dump=""
          if docker volume inspect jobapp_pgdata >/dev/null 2>&1; then
            # The database exists: back it up even if db is stopped (start it first).
            [[ -n "$($COMPOSE ps -q --status running db)" ]] || $COMPOSE up -d --wait db
            # Its own folder, so deploy dumps never push the nightly ones out. The retention is
            # the one of every backup (ops/db.sh, Retention): BACKUP_KEEP of this .env, else 7,
            # so the newest 7 predeploy dumps stay and one 7 days old or more goes, here once
            # this dump is verified and again at each nightly backup. No BACKUP_KEEP is set
            # here: a number of its own would keep predeploy dumps longer than the 7 days
            # within which a deleted document is promised to leave the server's backups.
            # What the script prints (paths, dump names, sizes, the retention) goes to a file of the
            # logs folder, never to this public log: the dump's name comes out, and its WARNING and
            # ERROR lines (its own words about the retention: names, ages, sizes). Its errors on
            # stderr name a dump or a command, never a row.
            out="$logdir/predeploy-${COMMIT:0:12}.log"
            rc=0
            (umask 077 && BACKUP_DIR="$BACKUPS/deploys" bash ops/db.sh backup --tag "predeploy-${COMMIT:0:12}" >"$out") || rc=$?
            dump="$(sed -n 's/^backup=//p' "$out" | tail -n 1)"
            # A WARNING or an ERROR of the backup must be seen, not only read by whoever opens
            # this group of a green job: a rotation held by the size check deletes nothing until
            # the owner acts (ops/db.sh, size_check), and a BACKUP_KEEP above 7 breaks the 7
            # days. As annotations they are on the summary page of the run. The step goes on.
            while IFS= read -r line; do
              case "$line" in
                "   WARNING: "*) echo "::warning::predeploy backup: ${line:3:500}" ;;
                "   ERROR: "*) echo "::error::predeploy backup: ${line:3:500}" ;;
              esac
            done <"$out"
            if ((rc != 0)); then
              echo "::error::the predeploy backup failed (exit $rc; its output is on the Jetson in logs/${out##*/}): nothing was migrated"
              restore_previous
              exit 1
            fi
            echo "predeploy dump: ${dump##*/}"
            [[ -n "$dump" ]] || { echo "::error::ops/db.sh reported no backup file"; restore_previous; exit 1; }
          else
            echo "no jobapp_pgdata volume: first start, nothing to back up"
          fi
          echo "::endgroup::"

          # Issue #81 (header): the schema moves first, in a one off container of the new api
          # image, while the previous release still serves. A failure stops the deploy before
          # anything restarts; ops/migrate.sh says why, and never downgrades.
          echo "::group::migrations (one off container of the new api image, before the new code starts)"
          if ! MIGRATE_LOG_DIR="$logdir" bash ops/migrate.sh; then
            echo "::error::the migrations did not apply: the deploy stopped before starting the new code, the running stack was not touched and still runs the previous release. The reason is above: after a lock timeout run the deploy again, otherwise fix the migration and deploy again"
            restore_previous
            exit 1
          fi
          echo "::endgroup::"

          rollback() { # the previous files and images back, started again; the schema stays migrated
            echo "::error::$1: rolling back to the previous files and images"
            restore_previous
            $COMPOSE up -d --remove-orphans --wait --wait-timeout 180 || true
            # Figures only (header), as the step State on failure prints them.
            $COMPOSE ps -a --format '{{.Service}} {{.State}} health={{.Health}} exit={{.ExitCode}}' 2>/dev/null |
              awk '{ for (i = 1; i <= NF; i++) if ($i !~ /^[A-Za-z0-9._:=-]+$/) $i = "-"; print "state: " $0 }' || true
            echo "::warning::the schema stays migrated, it is never downgraded automatically: the previous release runs on it by the expand rule (CONTRIBUTING.md, Migrations)"
            if [[ -n "$dump" ]]; then
              echo "::warning::database dump taken before this deploy: $dump (restore: BACKUP_DIR=$BACKUPS/deploys bash ops/db.sh restore-live $dump)"
            fi
            exit 1
          }

          # The browser starts only behind the host firewall of its egress network, installed once
          # by the owner (sudo bash ops/browser-egress.sh install); otherwise it is removed and the
          # rest deploys without it (browser B6).
          echo "::group::browser behind its host firewall (ops/browser-egress.sh)"
          if [[ "$browser_built" == 0 ]]; then
            # The same removal as a failed firewall check: no browser runs without an image that
            # was built and checked in this deploy.
            COMPOSE="$COMPOSE" bash ops/browser-egress.sh skip "the browser image did not build" || true
            echo "::warning::the browser is not deployed (its image did not build); everything else deploys"
            printf '### The browser is NOT deployed\n\nIts image did not build. Everything else deployed. Fix the build and deploy again.\n\n' >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          elif COMPOSE="$COMPOSE" bash ops/browser-egress.sh deploy; then
            COMPOSE="$COMPOSE --profile browser"
          else
            echo "::warning::the browser is not started (above); everything else deploys"
          fi
          echo "::endgroup::"

          echo "::group::compose up --wait"
          $COMPOSE up -d --remove-orphans --wait --wait-timeout 180 || rollback "compose up did not become healthy"
          echo "alembic current: $($COMPOSE exec -T api alembic current 2>/dev/null | tr -d '\r')"
          echo "::endgroup::"

          # Up on the migrated schema: from here a failure does not roll back (header, issue #16).
          trap - ERR

          echo "::group::smoke (tests/jetson_smoke.sh, quick mode, on the Jetson)"
          cd "$GITHUB_WORKSPACE"
          # Figures only here (check names, ok or FAIL, HTTP status codes); the detail (addresses,
          # bodies) goes to its file in the logs folder.
          DEPLOY_HOST=local JETSON_SMOKE_FULL=0 JETSON_SMOKE_LOG="$logdir/smoke-${COMMIT:0:12}.log" tests/jetson_smoke.sh
          echo "::endgroup::"

          # Only now: the commit is running and passed the smoke.
          echo "$COMMIT" > "$APP/.deployed-commit"
          echo "deployed $COMMIT"

      # --- tailscale: the stable Funnel URL (https://<node>.<tailnet>.ts.net) -----------------
      - name: Public URL
        working-directory: ${{ env.APP }}
        run: |
          set -euo pipefail
          # Self.DNSName of `tailscale status --json --peers=false`, as ./deploy.sh url reads it.
          url=""
          for _ in $(seq 1 15); do
            status="$($COMPOSE exec -T tailscale tailscale status --json --peers=false 2>/dev/null || true)"
            if [[ "$(sed -n 's/^[[:space:]]*"BackendState":[[:space:]]*"\([^"]*\)".*/\1/p' <<<"$status" | head -n 1)" == "Running" ]]; then
              dns="$(sed -n 's/^[[:space:]]*"DNSName":[[:space:]]*"\([^"]*\)".*/\1/p' <<<"$status" | head -n 1)"
              [[ "${dns%.}" =~ \.ts\.net$ ]] && url="https://${dns%.}" && break
            fi
            sleep 2
          done
          [[ -n "$url" ]] || { echo "::error::tailscale is not connected or has no ts.net name (its log stays on the Jetson: ./deploy.sh logs tailscale, over ssh)"; exit 1; }
          public="no answer yet (the first request after a first login waits for the certificate)"
          for delay in 2 4 8 15 15 15; do
            if [[ "$(curl -s --max-time 10 "$url/api/health" || true)" == '{"status":"ok"}' ]]; then
              public="answers /api/health"
              break
            fi
            sleep "$delay"
          done
          {
            echo "### Deployed ${COMMIT:0:12} to the Jetson"
            echo
            echo "- Public URL: $url ($public)"
            echo "- Target: $TARGET, trigger: $GITHUB_EVENT_NAME"
            echo "- alembic: $($COMPOSE exec -T api alembic current 2>/dev/null | tr -d '\r')"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$url"
      # --- end of tailscale -------------------------------------------------------------------

      # The figures of the stack, read on the Jetson (header): also after a Public URL step that
      # failed, never after a deploy step that failed (its rollback is a red run already). From the
      # checkout, the commit just deployed. The step's own text holds no JOBAPP-VERIFY line, so a
      # reader of the log finds the script's line only.
      - name: Verify the Jetson
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: bash ops/jetson-verify.sh "$APP"

      # The run log of this public repository is readable by anyone: figures only (service, state,
      # health, exit code) and the names of the newest predeploy dumps, never a log line. The logs
      # stay on the Jetson (./deploy.sh logs <service>, over ssh, for the owner).
      - name: State on failure
        if: failure()
        working-directory: ${{ env.APP }}
        run: |
          $COMPOSE --profile browser ps -a --format '{{.Service}} {{.State}} health={{.Health}} exit={{.ExitCode}}' 2>/dev/null |
            awk '{ for (i = 1; i <= NF; i++) if ($i !~ /^[A-Za-z0-9._:=-]+$/) $i = "-"; print "state: " $0 }' || true
          find "$BACKUPS/deploys" -maxdepth 1 -type f -name 'jobapp-*.dump' -printf '%f\n' 2>/dev/null |
            sort | tail -n 3 | sed 's/^/predeploy dump: /' || true
