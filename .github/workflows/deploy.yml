# Continuous delivery to the Jetson (SPEC-platform.md, Repository and automation; CONTRIBUTING.md).
#
# Automatic: once CI has finished green for a push to main, on the self-hosted runner installed on
# the Jetson by ./deploy.sh runner install (labels self-hosted, jetson). The runner only connects
# out to GitHub; no port is opened. Manual: workflow_dispatch, on any ref (used to test a branch
# before it merges; main's next merge redeploys main).
#
# The same steps as ./deploy.sh, run on the Jetson itself: rsync of the checked out commit into
# ~/jobapp with .rsyncignore (the .env there is never touched), build, a database backup, compose
# up --wait, migrations, tests/jetson_smoke.sh in quick mode, the public URL in the job summary.
# The images are built before anything restarts: a failed build leaves the running stack as it was.
#
# Security: the runner has the host Docker socket, which is root on the Jetson. Only this private
# repository's workflows reach it; it must never be offered to forks or public repositories.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a deploy that has started always finishes.
concurrency:
  group: deploy-jetson
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to the Jetson
    # workflow_run fires for every completed CI run on main: deploy only a green push.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, jetson]
    timeout-minutes: 40
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      COMPOSE: docker compose -f compose.yml --profile tunnel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
          clean: true

      - name: Preflight
        run: |
          set -euo pipefail
          # JOBAPP_DIR and BACKUP_DIR are set in the runner container by ./deploy.sh runner install.
          app="${JOBAPP_DIR:-$HOME/jobapp}"
          echo "APP=$app" >> "$GITHUB_ENV"
          [[ "$(uname -m)" == "aarch64" ]] || { echo "::error::not on the Jetson"; exit 1; }
          [[ -f "$app/.env" ]] || { echo "::error::$app/.env is missing: the first deploy is ./deploy.sh from the Mac"; exit 1; }
          docker info --format 'docker {{.ServerVersion}}'
          docker compose version
          free_gb="$(df -Pk "$app" | awk 'NR==2 {print int($4 / 1024 / 1024)}')"
          echo "disk: ${free_gb}G free"
          ((free_gb > 5)) || { echo "::error::only ${free_gb}G free on the Jetson"; exit 1; }
          echo "commit: $COMMIT ($(git log -1 --format=%s))"
          echo "previous: $(cat "$app/.deployed-commit" 2>/dev/null || echo unknown)"

      - name: Sync ~/jobapp from the commit
        run: |
          set -euo pipefail
          app="$APP"
          # deploy.sh sync_tree rules: .rsyncignore excludes .env*, so --delete never removes it.
          rsync -a --delete --exclude-from=.rsyncignore --exclude=.deployed-commit ./ "$app/"
          echo "$COMMIT" > "$app/.deployed-commit"
          echo "files: $(find "$app" -type f | wc -l)"

      - name: Build images (the running stack is untouched until this succeeds)
        working-directory: ${{ env.APP }}
        run: |
          set -euo pipefail
          for svc in api caddy; do
            start=$SECONDS
            $COMPOSE --progress=plain build "$svc"
            echo "build $svc: $((SECONDS - start))s"
          done

      - name: Backup before migrations
        working-directory: ${{ env.APP }}
        run: |
          set -euo pipefail
          if [[ -n "$($COMPOSE ps -q --status running db)" ]]; then
            # Its own folder and retention, so deploy dumps never push the nightly ones out.
            BACKUP_DIR="${BACKUP_DIR:-$HOME/jobapp-backups}/deploys" BACKUP_KEEP=10 \
              bash ops/db.sh backup --tag "predeploy-${COMMIT:0:12}"
          else
            echo "db is not running: nothing to back up (first start)"
          fi

      - name: Compose up --wait
        working-directory: ${{ env.APP }}
        run: $COMPOSE up -d --remove-orphans --wait --wait-timeout 180

      - name: Migrations
        working-directory: ${{ env.APP }}
        run: |
          set -euo pipefail
          $COMPOSE exec -T api alembic upgrade head
          echo "alembic current: $($COMPOSE exec -T api alembic current 2>/dev/null | tr -d '\r')"

      - name: Smoke (tests/jetson_smoke.sh, quick mode, on the Jetson)
        env:
          DEPLOY_HOST: local
          JETSON_SMOKE_FULL: "0"
        run: tests/jetson_smoke.sh

      - name: Public URL
        working-directory: ${{ env.APP }}
        run: |
          set -euo pipefail
          id="$($COMPOSE ps -q cloudflared)"
          url=""
          for _ in $(seq 1 15); do
            started="$(docker inspect -f '{{.State.StartedAt}}' "$id")"
            url="$(docker logs --since "$started" "$id" 2>&1 |
              grep -oE 'https://[a-z0-9]+(-[a-z0-9]+)*\.trycloudflare\.com' | grep -v '^https://api\.' | tail -n 1 || true)"
            [[ -n "$url" ]] && break
            sleep 2
          done
          [[ -n "$url" ]] || { echo "::error::cloudflared logged no trycloudflare URL"; exit 1; }
          public="not checked"
          for delay in 2 4 8 15 15 15; do
            if [[ "$(curl -s --max-time 10 "$url/api/health" || true)" == '{"status":"ok"}' ]]; then
              public="answers /api/health"
              break
            fi
            sleep "$delay"
          done
          [[ "$public" != "not checked" ]] || public="no answer yet (a fresh hostname can take a minute)"
          {
            echo "### Deployed ${COMMIT:0:12} to the Jetson"
            echo
            echo "- Public URL: $url ($public)"
            echo "- Ref: ${{ github.ref_name }}, trigger: ${{ github.event_name }}"
            echo "- alembic: $($COMPOSE exec -T api alembic current 2>/dev/null | tr -d '\r')"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$url"

      - name: State on failure
        if: failure()
        working-directory: ${{ env.APP }}
        run: |
          $COMPOSE ps -a || true
          $COMPOSE logs --no-color --tail 80 || true
