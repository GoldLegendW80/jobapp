# Continuous integration (SPEC-platform.md, Repository and automation; CONTRIBUTING.md).
# Every pull request and every push to main: api lint and tests against Postgres and Redis service
# containers, web lint, typecheck, Vitest and build, the shell scripts, the browser journeys against
# a scratch Compose stack built on the runner, and the pre-commit hooks not covered elsewhere.
# A green run on main is what .github/workflows/deploy.yml waits for.
#
# Actions are pinned by full commit SHA (the tag in the comment). Runs on GitHub's x86 runners:
# tests only, the arm64 images are built on the Jetson by the deploy workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.28"
  NODE_VERSION: "22.23.3"
  FORCE_COLOR: "1"

jobs:
  api:
    name: api (ruff, pytest, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: jobapp
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: jobapp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobapp -d jobapp_test -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://jobapp:ci-only-not-a-secret@127.0.0.1:5432/jobapp_test
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run --frozen ruff check --output-format=github .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      # The docker-marked tests (database stopped, restarted, paused) start their own throwaway
      # Postgres containers, so they run in the next step, on the runner's Docker daemon, not
      # against the shared service container.
      # pytest-xdist: PYTEST_WORKERS processes, each on a database of its own created next to
      # TEST_DATABASE_URL's (tests/conftest.py), so migrations and TRUNCATE never cross. argon2 runs
      # at a cheap cost in-process (tests/conftest.py fast_argon2); the production cost is checked
      # by tests/identity/test_security.py. Issue #9: this step took 10 to 25 minutes before.
      - name: Pytest with coverage (at least 95 percent), in parallel
        env:
          PYTEST_WORKERS: "4"
        run: |
          start=$SECONDS
          uv run --frozen pytest -m "not docker" -p no:cacheprovider -n "$PYTEST_WORKERS" \
            --cov --cov-report=term --cov-fail-under=95 --durations=15 \
            --junitxml=${{ runner.temp }}/junit-api.xml
          echo "pytest (not docker, $PYTEST_WORKERS workers): $((SECONDS - start))s wall" | tee -a "$RUNNER_TEMP/api-timings.txt"
      # Serial, without -n: these stop, restart and pause Postgres containers of their own.
      - name: Pytest, docker-marked (own Postgres containers stopped, restarted, paused)
        timeout-minutes: 10
        run: |
          start=$SECONDS
          uv run --frozen pytest -m docker -p no:cacheprovider \
            --junitxml=${{ runner.temp }}/junit-api-docker.xml
          echo "pytest (docker-marked, serial): $((SECONDS - start))s wall" | tee -a "$RUNNER_TEMP/api-timings.txt"
      - name: Test summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/api-timings.txt" ]]; then
            { echo "### api timings"; echo; sed 's/^/- /' "$RUNNER_TEMP/api-timings.txt"; echo; } >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 ../.github/scripts/junit_summary.py api "${{ runner.temp }}/junit-api.xml" >> "$GITHUB_STEP_SUMMARY"
          python3 ../.github/scripts/junit_summary.py "api (docker)" "${{ runner.temp }}/junit-api-docker.xml" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: web (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from packageManager in web/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Vitest
        run: pnpm exec vitest run --reporter=default --reporter=junit --outputFile=${{ runner.temp }}/junit-web.xml
      - name: Build
        run: pnpm build
      - name: Test summary
        if: always()
        run: python3 ../.github/scripts/junit_summary.py web "${{ runner.temp }}/junit-web.xml" >> "$GITHUB_STEP_SUMMARY"

  shell:
    name: shell (shellcheck, deploy.sh tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Shellcheck (pinned image, as tests/deploy_test.sh and pre-commit)
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0
          deploy.sh ops/db.sh ops/previous.sh ops/runner/entrypoint.sh ops/runner/job-guard.sh .github/scripts/ci_env.sh
          tests/deploy_test.sh tests/jetson_smoke.sh tests/backup_test.sh tests/crash_check.sh
          tests/reboot_check.sh tests/e2e_jetson.sh
      # deploy.sh against fake ssh and docker: no Jetson, nothing remote.
      - name: tests/deploy_test.sh
        run: tests/deploy_test.sh

  e2e:
    name: e2e (Playwright on a scratch Compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT: jobapp-ci
      E2E_CADDY_URL: http://127.0.0.1:8080
      E2E_COMPOSE_PROJECT: jobapp-ci
      E2E_EVIDENCE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Environment of the scratch stack (random secrets, never committed)
        run: |
          umask 077
          .github/scripts/ci_env.sh 8080 > .env
          ! grep -q change-me .env
      # tests/ats-stub.compose.yml: the board check asks a stub (tests/ats_stub.py), never the
      # real Ashby, Greenhouse or Lever, so their availability cannot turn this job red.
      - name: Build and start the stack
        run: >-
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml
          up -d --build --wait --wait-timeout 300
      - name: Migrations
        run: docker compose -p "$PROJECT" -f compose.yml exec -T api alembic upgrade head
      - name: Install web dependencies and Chromium
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Synthetic job folder (made-up rows, never Harald's data)
        run: python3 .github/scripts/synthetic_jobs.py "$RUNNER_TEMP/synthetic/data"
      - name: Identity, invites, users, account, profile and throttle journeys
        working-directory: web
        env:
          E2E_ADMIN_EMAIL: e2e-admin@example.org
          E2E_PASSWORD_THROTTLE: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/identity
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm exec playwright test -c e2e/identity-all.config.ts --reporter=list,html
      - name: Jobs journeys on the synthetic import, and the map
        working-directory: web
        env:
          E2E_JOBS_DATA: ${{ runner.temp }}/synthetic/data
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/jobs
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm exec playwright test jobs.spec.ts jobs-map.spec.ts --workers=1 --reporter=list,html
      - name: Stack logs
        if: failure()
        run: |
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml ps -a
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml logs --no-color > "$RUNNER_TEMP/compose.log" 2>&1 || true
      - name: Upload Playwright report, traces, screenshots and logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/
            web/test-results/
            tasks/evidence/ci/
            ${{ runner.temp }}/compose.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Tear down the scratch stack
        if: always()
        run: docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml down -v --remove-orphans || true

  precommit:
    name: pre-commit (file fixers, gitleaks, prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # ruff runs in the api job, eslint in the web job, shellcheck in the shell job.
      - name: pre-commit run --all-files
        env:
          SKIP: ruff-check,ruff-format,eslint,shellcheck
        run: uvx --from pre-commit==4.6.2 pre-commit run --all-files --show-diff-on-failure
