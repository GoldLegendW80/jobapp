# Continuous integration (SPEC-platform.md, Repository and automation; CONTRIBUTING.md).
#
# MANUAL ONLY since 2026-10-13 (issue #116, the owner's decision): no run per pull request and none
# per push to main any more. A run took about ten minutes on the Mac runners and runs queued
# behind each other. What a merge waits for now is ops/local-check.sh, which runs the steps of the
# three jobs below natively on the Mac, once, on the tree a batch of approved pull requests
# produces (CONTRIBUTING.md, Merging), and the deploy is started by ops/deploy-checked.sh.
# This file stays as the definition of those steps: ops/local-check.sh reads from it the list of
# files of the Shellcheck step and the tests/*_test.sh steps, and tests pin the rest.
# To run it by hand, on a branch or on main, with a runner started (ops/ci-runners.sh start, or
# CI_RUNS_ON set to GitHub's machines, below):
#   gh workflow enable ci.yml                 once, the workflow is disabled in the settings
#   gh workflow run ci.yml --ref <branch>
# A run started by hand has no pull request to narrow it by: the plan runs everything.
#
# What it runs: api lint and tests against Postgres and Redis service
# containers with the coverage floor, web lint, typecheck, Vitest and build, the shell scripts,
# the browser journeys against scratch Compose stacks built on the runner, and the pre-commit
# hooks not covered elsewhere. Nothing waits for a run: .github/workflows/deploy.yml is started on
# demand, for a tree that passed ops/local-check.sh.
#
# Layout (issue #91): three jobs of about the same length, one per runner.
#   api       ruff, the whole pytest suite in one run with the 95 percent floor, the docker
#             marked tests, the scoring timing test
#   checks    pre-commit and the secret scan of the run's commits, the shell unit (shellcheck,
#             tests/*.sh), then the e2e groups apps and ingestion, each on a scratch stack of
#             its own
#   journeys  eslint, tsc, build, Vitest, then the e2e groups identity and sweep, each on a
#             scratch stack of its own
# The run is green when the three are: no job has a condition or waits for another, so none can
# be skipped, and a failed one fails the run. There is no fourth job to sum them up: a job
# created when the three end queues behind every job other runs queued meanwhile (the gate of
# run 38078877905 waited 8 minutes for a runner to do 7 seconds of work).
# Why three: a job costs about 25 s before its first test (set up, checkout, tools, install) and
# GitHub starts queued jobs in no particular order, so eleven jobs on three runners paid that
# cost eleven times and let short jobs start before long ones (run 38072303967: 22.8 minutes of
# runner time, 13.3 of wall time on two runners). Three jobs start together and end together.
# The numbers behind the split are in README, Continuous delivery.
#
# Plan: the first step of each job (.github/scripts/ci_plan.py) decides from the files a pull
# request against main changes which units run: api, web, shell, e2e. Documentation alone runs
# pre-commit and nothing else (the README also the shell unit, which checks it); web/ alone
# skips the api unit; any other path runs everything, and so do every push to main, every manual
# run and every pull request against another branch than main (GITHUB_BASE_REF). Each job ends with
# `ci_plan.py verify`, which fails it when a step the plan needed did not run or one it left out
# did, so a wrong `if:` cannot pass for a skipped test.
#
# Every step has an id and is listed in ci_plan.py: as a check of a unit (LANES), as a step of
# every run (ALWAYS) or as a support step (SUPPORT). ci_plan_test.py fails on a step that is in
# none of the three, so a check cannot be added here without `verify` knowing it.
#
# Step conditions, one pattern throughout:
# - the first step of a unit: `!cancelled() && steps.plan.outputs.<unit> == 'true'`, so a unit
#   runs whatever happened to the units before it in the job;
# - a step that needs an earlier step of its unit names it: `steps.<id>.outcome == 'success'`.
# A failed step still fails the job: nothing here uses continue-on-error.
#
# Exit codes: every run step uses `bash --noprofile --norc -eo pipefail`, through `shell: bash`
# in defaults.run (without it GitHub runs `bash -e`, where `gate | tail` ends with the status of
# tail). A job that sets its own defaults.run must repeat `shell: bash` there (run 38047794828).
# A command that gates anything is still never piped, and never negated with `!` (bash -e does
# not stop on a negated command): it runs on its own line or under an explicit `if`.
#
# Actions are pinned by full commit SHA (the tag in the comment). Tests only: the images that
# ship are built on the Jetson by the deploy workflow.
#
# Where it runs (issue #83): on the self-hosted runners of the owner's Mac, labels
# [self-hosted, mac-ci] (ops/ci-runners.sh, ops/ci-runner/: Linux arm64 containers in Docker
# Desktop, each with a Docker daemon of its own, so a job sees what it saw on a GitHub machine:
# `services:`, its own 127.0.0.1, its own container names and ports). Never [self-hosted] alone:
# the Jetson's deploy runner carries that label too.
# Load: the Mac is shared with its owner and with agents, so CI has a fixed budget there: each
# runner is pinned to 3 CPUs and 4 GB (ops/ci-runners.sh), a runner takes one job, the rest
# queue. Worker counts are written out (PYTEST_WORKERS, VITEST_WORKERS below), never "all
# cores". With one, two or three runners the jobs are the same; fewer runners only queue them.
# Escape hatch, back to GitHub's machines without editing this file:
#   gh variable set CI_RUNS_ON --body '"ubuntu-latest"'      and back: gh variable delete CI_RUNS_ON
# CI_RUNS_ON is the JSON of a runs-on value. Steps that differ test runner.environment
# ('github-hosted' or 'self-hosted'): caches go to GitHub's cache service there, and stay on the
# runner's disk here (uv, pnpm, Playwright and pre-commit through the runner's environment, image
# layers in the runner's own Docker daemon).
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.9.28"
  NODE_VERSION: "22.23.3"
  FORCE_COLOR: "1"
  # Processes per test run: the 3 CPUs of a Mac runner. GitHub's machines have 2 to 4.
  PYTEST_WORKERS: "3"
  VITEST_WORKERS: "3"
  # The service containers of the api job, given to its pytest steps as TEST_DATABASE_URL and
  # REDIS_URL.
  API_TEST_DATABASE_URL: postgresql+psycopg://jobapp:ci-only-not-a-secret@127.0.0.1:5432/jobapp_test
  API_TEST_REDIS_URL: redis://127.0.0.1:6379/0

jobs:
  # ------------------------------------------------------------------------------------- api
  # The whole api suite in one pytest run on the runner's 3 CPUs, and nothing else in this job:
  # it is the one unit that fills its CPUs for the whole time. Not sharded any more: two shards
  # took 101 s and 146 s of tests on two runners plus a third job to combine their coverage; one
  # run needs no hand-over, every test is collected once by construction (`tests`, split only
  # by the docker marker below) and the floor is read from this run's own data.
  # name: the id and nothing else. A ruleset, a script or a person that asks for the checks of
  # a run names these three strings; what a job holds is written in the comments and in the
  # names of its steps, which may change (a unit moved between jobs in the first week).
  api:
    name: api
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "mac-ci"]') }}
    timeout-minutes: 30
    services:
      # --health-start-interval: probed every second while starting, so the job does not wait a
      # whole 5 s interval for the first answer.
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: jobapp
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: jobapp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobapp -d jobapp_test -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 20
          --health-start-period 20s --health-start-interval 1s
      redis:
        image: redis:7.4.11-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 20 --health-start-period 20s --health-start-interval 1s
    steps:
      # fetch-depth 2: the merge commit of a pull request and its parents, which the plan diffs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Plan (the units this run needs, .github/scripts/ci_plan.py)
        id: plan
        run: python3 .github/scripts/ci_plan.py
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: uv
        if: steps.plan.outputs.api == 'true'
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-glob: api/uv.lock

      # --- unit: api -----------------------------------------------------------------------
      # The service's data is thrown away with the job, so durability buys nothing: without
      # fsync the TRUNCATE after each test costs less than half (api/tests/pg.py does the same
      # for the throwaway server of a local run).
      - name: Test Postgres without fsync (throwaway data)
        id: pg_nofsync
        if: steps.plan.outputs.api == 'true'
        run: >-
          docker exec "${{ job.services.postgres.id }}" psql -U jobapp -d jobapp_test
          -v ON_ERROR_STOP=1
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"
      - name: Install dependencies
        id: api_install
        if: steps.plan.outputs.api == 'true'
        working-directory: api
        run: uv sync --frozen
      - name: Ruff lint and format
        id: ruff
        if: ${{ !cancelled() && steps.api_install.outcome == 'success' }}
        working-directory: api
        run: |
          uv run --frozen ruff check --output-format=github .
          uv run --frozen ruff format --check .
      # pytest-xdist: each worker on a database of its own created next to TEST_DATABASE_URL's
      # (tests/conftest.py); argon2 runs at a cheap cost in-process (tests/conftest.py
      # fast_argon2). --dist worksteal: an idle worker takes tests from a busy one, so the one
      # long test (a 5,000 posting sweep, about a minute) does not leave two workers waiting.
      # The docker-marked tests run serially below.
      - name: Pytest, the whole suite in parallel, coverage data only
        id: pytest
        if: ${{ !cancelled() && steps.api_install.outcome == 'success' }}
        working-directory: api
        timeout-minutes: 15
        env:
          TEST_DATABASE_URL: ${{ env.API_TEST_DATABASE_URL }}
          REDIS_URL: ${{ env.API_TEST_REDIS_URL }}
        run: |
          start=$SECONDS
          uv run --frozen pytest tests -m "not docker" -p no:cacheprovider \
            -n "$PYTEST_WORKERS" --dist worksteal --cov --cov-report= --cov-fail-under=0 \
            --durations=25 --junitxml=${{ runner.temp }}/junit-api.xml
          echo "pytest (not docker, -n $PYTEST_WORKERS): $((SECONDS - start))s wall" | tee -a "$RUNNER_TEMP/api-timings.txt"
      # The gate. Alone in its step and not piped: its exit status is the step's status. The
      # data file is the one the run above wrote, its workers combined by pytest-cov.
      - name: Coverage floor (at least 95 percent of the combined data)
        id: coverage
        if: ${{ !cancelled() && steps.pytest.outcome == 'success' }}
        working-directory: api
        run: uv run --frozen coverage report --fail-under=95
      # --fail-under=0: this step only reports, also when the floor above failed.
      - name: Coverage summary
        id: coverage_summary
        if: ${{ !cancelled() && steps.pytest.outcome == 'success' }}
        working-directory: api
        run: |
          total="$(uv run --frozen coverage report --format=total --fail-under=0)"
          { echo "### api coverage"; echo; echo "- total: ${total} percent (floor: 95)"; } >> "$GITHUB_STEP_SUMMARY"
      # Serial, without -n: these stop, restart and pause Postgres containers of their own, and
      # run the parser service in its real container against a handler that tries to get out
      # (tests/ingestion/parser/test_container.py: the worker image built here from the
      # runner's layer cache, a stack of its own, about 70 s, of which 60 are the wall clock
      # limit at its real value). No --cov: they add nothing to the coverage figure (and never
      # did).
      - name: Pytest, docker-marked (own Postgres containers; the parser in its container)
        id: docker_tests
        if: ${{ !cancelled() && steps.api_install.outcome == 'success' }}
        working-directory: api
        timeout-minutes: 10
        env:
          TEST_DATABASE_URL: ${{ env.API_TEST_DATABASE_URL }}
          REDIS_URL: ${{ env.API_TEST_REDIS_URL }}
        run: |
          start=$SECONDS
          uv run --frozen pytest -m docker -p no:cacheprovider \
            --junitxml=${{ runner.temp }}/junit-api-docker.xml
          echo "pytest (docker-marked, serial): $((SECONDS - start))s wall" | tee -a "$RUNNER_TEMP/api-timings.txt"
      # Issue #16: the scorer's speed bound without coverage tracing or other workers sharing the
      # cores, so it can be tight (0.3 s of CPU, the best of 3).
      - name: Pytest, scoring timing alone (no coverage, 0.3 s)
        id: scoring
        if: ${{ !cancelled() && steps.api_install.outcome == 'success' }}
        working-directory: api
        env:
          TEST_DATABASE_URL: ${{ env.API_TEST_DATABASE_URL }}
          REDIS_URL: ${{ env.API_TEST_REDIS_URL }}
          SCORE_BUDGET_S: "0.3"
        run: >-
          uv run --frozen pytest -p no:cacheprovider
          "tests/jobs/test_scoring.py::test_long_text_is_bounded_and_fast"
      - name: Test summary
        id: summary
        if: ${{ always() && steps.plan.outputs.api == 'true' }}
        run: |
          if [[ -f "$RUNNER_TEMP/api-timings.txt" ]]; then
            { echo "### api timings"; echo; sed 's/^/- /' "$RUNNER_TEMP/api-timings.txt"; echo; } >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 .github/scripts/junit_summary.py "api" "${{ runner.temp }}/junit-api.xml" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "${{ runner.temp }}/junit-api-docker.xml" ]]; then
            python3 .github/scripts/junit_summary.py "api (docker)" "${{ runner.temp }}/junit-api-docker.xml" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The runner's memory as the kernel counted it (the cgroup of the runner's container,
      # since that container started): its limit, how often the limit was reached ("max":
      # file cache is given back then, nothing fails) and whether anything was ever killed
      # ("oom_kill"). Written to the summary of the job; never fails it.
      - name: Runner memory
        id: memory
        if: ${{ always() }}
        run: |
          cg=/sys/fs/cgroup
          if [[ -r "$cg/memory.peak" && -r "$cg/memory.events" && "$(cat "$cg/memory.max")" =~ ^[0-9]+$ ]]; then
            {
              echo "### Runner memory (${RUNNER_NAME:-this runner}, since its container started)"
              echo
              echo "- limit $(($(cat "$cg/memory.max") / 1048576)) MB, highest use $(($(cat "$cg/memory.peak") / 1048576)) MB, file cache included"
              echo "- events: $(tr '\n' ' ' <"$cg/memory.events")"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no memory limit readable on this runner"
          fi

      - name: Every step the plan needs has run
        id: verify
        if: ${{ !cancelled() }}
        env:
          CI_LANE: api
          CI_PLAN: ${{ steps.plan.outputs.plan }}
          CI_JOB_STATUS: ${{ job.status }}
          CI_STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/ci_plan.py verify

  # ---------------------------------------------------------------------------------- checks
  # pre-commit on every run, then the shell unit (the fast checks in front), then the e2e group
  # apps (the longest group) against a scratch Compose stack; the worker runs with TEST_FAST_TIMERS
  # (tests/ats-stub.compose.yml). Every web/e2e/*.spec.ts is in one group or in the exclusion
  # list of .github/scripts/e2e_groups.py, which fails the shell unit and pre-commit otherwise.
  # Which job holds which unit follows the measured lengths (README, What a CI run does; run
  # 38078877905: api 255 s, this job 320 s with the web checks, journeys 262 s without them):
  # the api tests fill their job, so the shell unit sits here, and the web checks went to
  # journeys.
  # Images: built with buildx bake. On a Mac runner from the layer cache of the runner's own
  # Docker daemon (measured in run 38072303967: 22 s on a runner that never built them, under
  # 2 s after; nothing is shared between runners because there is nothing left to gain). On
  # GitHub's machines from the GitHub Actions layer cache, which only the journeys job writes.
  checks:
    name: checks
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "mac-ci"]') }}
    timeout-minutes: 30
    env:
      # The scratch stack of the e2e groups: one at a time in a job, the same project and port.
      PROJECT: jobapp-ci
      E2E_CADDY_URL: http://127.0.0.1:8080
      E2E_COMPOSE_PROJECT: jobapp-ci
      E2E_EVIDENCE: ci
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      # fetch-depth 0, in this job alone: the secret scan below reads every commit of the pull
      # request or of the push, and a shallow checkout would hand it a history with holes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Plan (the units this run needs, .github/scripts/ci_plan.py)
        id: plan
        run: python3 .github/scripts/ci_plan.py
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: uv
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-glob: api/uv.lock

      # --- every run: pre-commit -----------------------------------------------------------
      # On a Mac runner pre-commit's environments stay on the runner (PRE_COMMIT_HOME).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: precommit_cache
        if: runner.environment == 'github-hosted'
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # ruff runs in the api unit, eslint in the web unit, shellcheck in the shell unit. On a
      # run narrowed to documentation those units are skipped, and so are these three hooks:
      # the files they read did not change. gitleaks is skipped here because its hook reads
      # the staged changes, of which a checkout has none: it passed whatever was committed.
      # The secret scan is the next step.
      # No --show-diff-on-failure: it prints the lines a fixer changed, with their context, in
      # clear in the log of the job, and a file that holds a secret can be one a fixer touches.
      # The hook's own message names the file; `pre-commit run --all-files` at home shows the diff.
      # SKIP is set on this step and nowhere else in this file (ci_plan_test.py): in the job's
      # env it would skip the secret scan too, whose hook has the same id, with a green step.
      - name: pre-commit run --all-files
        id: precommit
        env:
          SKIP: ruff-check,ruff-format,eslint,shellcheck,gitleaks
        run: uvx --from pre-commit==4.6.2 pre-commit run --all-files
      # Every run, whatever the plan and whatever pre-commit said: the gitleaks that
      # .pre-commit-config.yaml pins, with its rules, on the commits of the pull request (each
      # one, the lines typed into a merge commit, the messages) and on the pull request as a
      # whole; on main, on the commits of the push (.github/scripts/secret_scan.sh;
      # tests/secret_scan_test.sh plants a secret and expects this command to fail).
      # --verbose: the log says which commits were read, also on a pass. env -u SKIP: no SKIP
      # from anywhere reaches this command.
      - name: Secret scan of the commits of this run (gitleaks)
        id: secrets
        if: ${{ !cancelled() }}
        env:
          CI_PUSH_BEFORE: ${{ github.event.before }}
        run: env -u SKIP uvx --from pre-commit==4.6.2 pre-commit run gitleaks-commits --hook-stage manual --verbose

      # --- unit: shell ---------------------------------------------------------------------
      # Every step on its own: one failing script does not hide the others.
      - name: Shellcheck (pinned image, as tests/deploy_test.sh and pre-commit)
        id: shellcheck
        if: ${{ !cancelled() && steps.plan.outputs.shell == 'true' }}
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0
          deploy.sh ops/db.sh ops/previous.sh ops/migrate.sh ops/runner/entrypoint.sh ops/runner/job-guard.sh .github/scripts/ci_env.sh
          .github/scripts/secret_scan.sh tests/secret_scan_test.sh
          ops/ci-runners.sh ops/ci-rerun.sh ops/ci-runner/entrypoint.sh ops/ci-runner/job-started.sh
          ops/ci-runner/job-completed.sh ops/ci-runner/ci-clean.sh tests/ci_runners_test.sh
          tests/deploy_test.sh tests/migrate_test.sh tests/jetson_smoke.sh tests/backup_test.sh tests/crash_check.sh
          tests/reboot_check.sh tests/e2e_jetson.sh tests/tailscale_test.sh tests/agents_real_run_jetson.sh
          tests/agents_real_run_test.sh tests/ingestion_parser_jetson.sh
          ops/env_check.sh tests/env_check_test.sh
          ops/local-check.sh ops/deploy-checked.sh tests/local_check_test.sh
          ops/agent-test.sh tests/agent_test_test.sh
          ops/ship.sh tests/ship_test.sh
      # Issue #18: the .env syntax check and where it runs (deploy.sh, deploy.yml, the smoke).
      - name: tests/env_check_test.sh
        id: env_check_test
        if: ${{ !cancelled() && steps.plan.outputs.shell == 'true' }}
        run: tests/env_check_test.sh
      # Every web/e2e/*.spec.ts is run by one e2e group or is excluded with a written reason.
      - name: e2e spec groups (.github/scripts/e2e_groups.py and its test)
        id: e2e_groups
        if: ${{ !cancelled() && steps.plan.outputs.shell == 'true' }}
        run: |
          python3 .github/scripts/e2e_groups_test.py
          python3 .github/scripts/e2e_groups.py
      # Issue #91: the path rules of the plan, the reasons that let a rule skip a unit, and that
      # this file's steps follow the plan.
      - name: CI plan (.github/scripts/ci_plan_test.py)
        id: ci_plan_test
        if: ${{ !cancelled() && steps.plan.outputs.shell == 'true' }}
        run: python3 .github/scripts/ci_plan_test.py
      # deploy.sh against fake ssh and docker: no Jetson, nothing remote.
      - name: tests/deploy_test.sh
        id: deploy_test
        if: ${{ !cancelled() && steps.plan.outputs.shell == 'true' }}
        run: tests/deploy_test.sh
      # The operator script of A5 against a fake ssh: a dry run leaves the committed evidence
      # untouched, a real run never overwrites it, only the owner's subscription gets a run.
      - name: tests/agents_real_run_test.sh
        id: agents_real_run_test
        if: ${{ !cancelled() && steps.plan.outputs.shell == 'true' }}
        run: tests/agents_real_run_test.sh
      # Issue #83: the Mac CI runners (ops/ci-runners.sh and the hooks of ops/ci-runner) against
      # fake docker and gh, and where ci.yml and deploy.yml send their jobs.
      - name: tests/ci_runners_test.sh
        id: ci_runners_test
        if: ${{ !cancelled() && steps.plan.outputs.shell == 'true' }}
        run: tests/ci_runners_test.sh
      # The secret scan above, on throwaway repositories: the example secret of gitleaks' own
      # documentation is committed, as a pull request and as a push, and the command of that
      # step must fail; a clean history and an allowed line must pass.
      - name: tests/secret_scan_test.sh
        id: secret_scan_test
        if: ${{ !cancelled() && steps.plan.outputs.shell == 'true' }}
        run: tests/secret_scan_test.sh
      # tailscale (Funnel): compose config and caddy's :8080 trust rules. No key, no tailnet; the
      # live no-key start is skipped here (CI is set, and the image is pinned to arm64).
      - name: tests/tailscale_test.sh
        id: tailscale_test
        if: ${{ !cancelled() && steps.plan.outputs.shell == 'true' }}
        run: tests/tailscale_test.sh
      # Issue #116: the batch check and the checked deploy (ops/local-check.sh,
      # ops/deploy-checked.sh) on throwaway repositories with stub steps: the lock, the disk
      # floor, a merge conflict, a failing step, the record of a pass, the cleanup.
      - name: tests/local_check_test.sh
        id: local_check_test
        if: ${{ !cancelled() && steps.plan.outputs.shell == 'true' }}
        run: tests/local_check_test.sh
      # Issue #280: how agents run tests beside the batch check (ops/agent-test.sh), with fake
      # docker, uv and pnpm: the -n and worker limits, the lock, the throwaway services' cleanup.
      - name: tests/agent_test_test.sh
        id: agent_test_test
        if: ${{ !cancelled() && steps.plan.outputs.shell == 'true' }}
        run: tests/agent_test_test.sh
      # Issue #278: approved pull requests to production (ops/ship.sh) against fake gh, ssh, gate
      # and deploy: selection, order, bisect, a head that moved, refusals, a failed deploy.
      - name: tests/ship_test.sh
        id: ship_test
        if: ${{ !cancelled() && steps.plan.outputs.shell == 'true' }}
        run: tests/ship_test.sh

      # --- unit: e2e (groups apps and ingestion) -------------------------------------------
      # Playwright comes with the web dependencies. The pnpm version comes from packageManager
      # in web/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        id: pnpm
        if: ${{ !cancelled() && steps.plan.outputs.e2e == 'true' }}
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        if: ${{ !cancelled() && steps.plan.outputs.e2e == 'true' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        id: web_install
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Environment of the scratch stack (random secrets, never committed)
        id: e2e_env
        if: ${{ !cancelled() && steps.plan.outputs.e2e == 'true' && steps.web_install.outcome == 'success' }}
        run: |
          umask 077
          .github/scripts/ci_env.sh 8080 > .env
          if grep -q change-me .env; then
            echo "::error::a placeholder secret of .env.example was left in .env"
            exit 1
          fi
          # Agents A2: the worker replays recorded streams instead of calling a model (refused
          # when APP_ENV is production; this stack is development).
          echo "AGENTS_FAKE_BACKEND=true" >> .env
      # On a Mac runner: the default builder of the runner's own Docker daemon, whose layer cache
      # stays on the runner's disk between jobs (bounded by the job-completed hook,
      # ops/ci-runner/ci-clean.sh). Nothing is uploaded or downloaded.
      - name: Build the images (buildx bake, the runner's own layer cache)
        id: images
        if: ${{ !cancelled() && steps.e2e_env.outcome == 'success' && runner.environment != 'github-hosted' }}
        run: docker buildx bake --progress=plain -f compose.yml --load api worker caddy renderer
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        if: ${{ !cancelled() && steps.e2e_env.outcome == 'success' && runner.environment == 'github-hosted' }}
      - name: Build the images (buildx bake, GitHub Actions layer cache, read only)
        id: images_hosted
        if: ${{ !cancelled() && steps.e2e_env.outcome == 'success' && runner.environment == 'github-hosted' }}
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: compose.yml
          targets: api,worker,caddy,renderer
          load: true
          set: |
            api.cache-from=type=gha,scope=e2e-api
            worker.cache-from=type=gha,scope=e2e-worker
            caddy.cache-from=type=gha,scope=e2e-caddy
      - name: Chromium for Playwright
        id: e2e_ready
        if: ${{ !cancelled() && (steps.images.outcome == 'success' || steps.images_hosted.outcome == 'success') }}
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      # tests/ats-stub.compose.yml: the board check asks a stub (tests/ats_stub.py) and the worker
      # api/tests/jobs/fake_ats.py, never the real Ashby, Greenhouse or Lever.
      # CI_COMPOSE_OVERLAY comes from the runner's own environment, never from this file: the
      # Mac runners set it to compose.mac.yml (ops/ci-runner/Dockerfile), GitHub's machines and
      # the Jetson do not have it. Only `up` needs the overlay (compose.mac.yml).
      - name: Start the stack and migrate (apps)
        id: apps_stack
        if: ${{ !cancelled() && steps.e2e_ready.outcome == 'success' }}
        run: |
          overlay=()
          if [[ -n "${CI_COMPOSE_OVERLAY:-}" ]]; then
            [[ -f "$CI_COMPOSE_OVERLAY" ]] || { echo "::error::the runner's CI_COMPOSE_OVERLAY names no file: $CI_COMPOSE_OVERLAY"; exit 1; }
            overlay=(-f "$CI_COMPOSE_OVERLAY")
            echo "compose overlay of this runner: $CI_COMPOSE_OVERLAY"
          fi
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml "${overlay[@]}" \
            up -d --no-build --wait --wait-timeout 300
          docker compose -p "$PROJECT" -f compose.yml exec -T api alembic upgrade head
      - name: Synthetic job folder (made-up rows, never Harald's data)
        id: apps_data
        if: ${{ !cancelled() && steps.apps_stack.outcome == 'success' }}
        run: python3 .github/scripts/synthetic_jobs.py "$RUNNER_TEMP/synthetic/data"
      # Jobs on the synthetic import and the map; agents A2 to A4 on the fake backend (a run
      # streaming, reload and network loss, cancel, forbidden tools, triage proposals, job chat),
      # and the answer appearing while it is written (issue #33, partial messages replayed).
      - name: Jobs, map and agent journeys
        id: e2e_apps
        if: ${{ !cancelled() && steps.apps_data.outcome == 'success' }}
        working-directory: web
        timeout-minutes: 12
        env:
          E2E_JOBS_DATA: ${{ runner.temp }}/synthetic/data
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/apps
        run: >-
          pnpm exec playwright test jobs.spec.ts jobs-map.spec.ts agents-runs.spec.ts
          agents-triage.spec.ts agents-chat.spec.ts agents-streaming.spec.ts
          --workers=1 --reporter=list,html --output=test-results/apps
      - name: Stack logs (apps)
        id: apps_logs
        if: ${{ failure() && steps.apps_stack.outcome != 'skipped' }}
        run: |
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml ps -a
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml logs --no-color > "$RUNNER_TEMP/compose-apps.log" 2>&1 || true
      # --timeout 0: the stack and its volumes are thrown away, so nothing waits for a clean stop.
      # Before the next group starts its own: the same project name and port. No `|| true` here,
      # unlike the last teardown of a job: the ingestion group's fresh database rests on this one
      # having removed the apps stack and its volumes, so a teardown that fails fails the job,
      # and the ingestion group does not start on what it left.
      - name: Tear down the scratch stack (apps)
        id: apps_down
        if: ${{ always() && steps.e2e_env.outcome == 'success' }}
        run: docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml down -v --remove-orphans --timeout 0

      # Group ingestion, on a fresh stack: its own database and volumes. It starts only when the
      # teardown above succeeded, and looks for itself: no container and no volume of the
      # project may be left.
      - name: Start the stack and migrate (ingestion)
        id: ingestion_stack
        if: ${{ !cancelled() && steps.e2e_ready.outcome == 'success' && steps.apps_down.outcome == 'success' }}
        run: |
          left="$({ docker ps -aq --filter "label=com.docker.compose.project=$PROJECT"; docker volume ls -q --filter "label=com.docker.compose.project=$PROJECT"; } | tr '\n' ' ')"
          if [[ -n "$left" ]]; then
            echo "::error::containers or volumes of the apps stack are still here, the ingestion group would not start on a fresh database: $left"
            exit 1
          fi
          overlay=()
          if [[ -n "${CI_COMPOSE_OVERLAY:-}" ]]; then
            [[ -f "$CI_COMPOSE_OVERLAY" ]] || { echo "::error::the runner's CI_COMPOSE_OVERLAY names no file: $CI_COMPOSE_OVERLAY"; exit 1; }
            overlay=(-f "$CI_COMPOSE_OVERLAY")
          fi
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml "${overlay[@]}" \
            up -d --no-build --wait --wait-timeout 300
          docker compose -p "$PROJECT" -f compose.yml exec -T api alembic upgrade head
      # Ingestion: documents (task G1: the page, uploads through Caddy up to 20 MiB, an upload
      # stopped on its way, the api's memory with two uploads at once, logs free of content),
      # then what later tasks add as web/e2e/ingestion-<task>.spec.ts. This step names a config,
      # not its specs: web/e2e/ingestion-all.config.ts runs every ingestion-*.spec.ts with one
      # worker, so a task of that module adds a spec without editing this file, and
      # .github/scripts/e2e_groups.py reads the config's SPEC_PREFIX to know what it covers.
      - name: Ingestion journeys
        id: e2e_ingestion
        if: ${{ !cancelled() && steps.ingestion_stack.outcome == 'success' }}
        working-directory: web
        timeout-minutes: 8
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/ingestion
        run: pnpm exec playwright test -c e2e/ingestion-all.config.ts --reporter=list,html --output=test-results/ingestion
      - name: Stack logs (ingestion)
        id: ingestion_logs
        if: ${{ failure() && steps.ingestion_stack.outcome != 'skipped' }}
        run: |
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml ps -a
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml logs --no-color > "$RUNNER_TEMP/compose-ingestion.log" 2>&1 || true
      # `|| true` on the last teardown of a job only: nothing starts after it, and the runner's
      # job-completed hook empties the daemon anyway.
      - name: Tear down the scratch stack (ingestion)
        id: ingestion_down
        if: ${{ always() && steps.e2e_env.outcome == 'success' }}
        run: docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml down -v --remove-orphans --timeout 0 || true
      - name: Upload Playwright report, traces, screenshots and logs
        id: upload
        if: ${{ failure() && steps.e2e_env.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/
            web/test-results/
            tasks/evidence/ci/
            ${{ runner.temp }}/compose-apps.log
            ${{ runner.temp }}/compose-ingestion.log
          retention-days: 14
          if-no-files-found: ignore

      # As in the api job.
      - name: Runner memory
        id: memory
        if: ${{ always() }}
        run: |
          cg=/sys/fs/cgroup
          if [[ -r "$cg/memory.peak" && -r "$cg/memory.events" && "$(cat "$cg/memory.max")" =~ ^[0-9]+$ ]]; then
            {
              echo "### Runner memory (${RUNNER_NAME:-this runner}, since its container started)"
              echo
              echo "- limit $(($(cat "$cg/memory.max") / 1048576)) MB, highest use $(($(cat "$cg/memory.peak") / 1048576)) MB, file cache included"
              echo "- events: $(tr '\n' ' ' <"$cg/memory.events")"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no memory limit readable on this runner"
          fi

      - name: Every step the plan needs has run
        id: verify
        if: ${{ !cancelled() }}
        env:
          CI_LANE: checks
          CI_PLAN: ${{ steps.plan.outputs.plan }}
          CI_JOB_STATUS: ${{ job.status }}
          CI_STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/ci_plan.py verify

  # -------------------------------------------------------------------------------- journeys
  # The web unit (eslint, tsc, build, Vitest in one run), then the e2e groups identity and sweep
  # one after the other, each on a scratch stack of its own (same project name and port, the first torn down with its volumes
  # before the second starts).
  journeys:
    name: journeys
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "mac-ci"]') }}
    timeout-minutes: 30
    env:
      # The scratch stack of the e2e groups: one at a time in a job, the same project and port.
      PROJECT: jobapp-ci
      E2E_CADDY_URL: http://127.0.0.1:8080
      E2E_COMPOSE_PROJECT: jobapp-ci
      E2E_EVIDENCE: ci
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Plan (the units this run needs, .github/scripts/ci_plan.py)
        id: plan
        run: python3 .github/scripts/ci_plan.py
      # uv: web/e2e/jobs.spec.ts and the profile journeys convert their fixtures with the api's
      # CLI through `uv run`.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: uv
        if: steps.plan.outputs.e2e == 'true'
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-glob: api/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        id: pnpm
        if: steps.plan.outputs.web == 'true' || steps.plan.outputs.e2e == 'true'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        if: steps.plan.outputs.web == 'true' || steps.plan.outputs.e2e == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        id: web_install
        if: steps.node.outcome == 'success'
        working-directory: web
        run: pnpm install --frozen-lockfile

      # --- unit: web (eslint, tsc, build, vitest) ----------------------------------------------
      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.plan.outputs.web == 'true' && steps.web_install.outcome == 'success' }}
        working-directory: web
        run: pnpm lint
      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.plan.outputs.web == 'true' && steps.web_install.outcome == 'success' }}
        working-directory: web
        run: pnpm typecheck
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.plan.outputs.web == 'true' && steps.web_install.outcome == 'success' }}
        working-directory: web
        run: pnpm build
      # Vitest in one run instead of two shards on two runners: the files are spread over the
      # same three workers either way, and a second job would pay its set up for 25 s of tests.
      - name: Vitest
        id: vitest
        if: ${{ !cancelled() && steps.plan.outputs.web == 'true' && steps.web_install.outcome == 'success' }}
        working-directory: web
        timeout-minutes: 8
        run: pnpm exec vitest run --maxWorkers="$VITEST_WORKERS" --reporter=default --reporter=junit --outputFile=${{ runner.temp }}/junit-web.xml
      - name: Test summary
        id: summary
        if: ${{ always() && steps.vitest.outcome != 'skipped' }}
        run: python3 .github/scripts/junit_summary.py "web" "${{ runner.temp }}/junit-web.xml" >> "$GITHUB_STEP_SUMMARY"

      # --- unit: e2e (groups identity and sweep) -------------------------------------------
      - name: Environment of the scratch stacks (random secrets, never committed)
        id: e2e_env
        if: ${{ !cancelled() && steps.plan.outputs.e2e == 'true' && steps.web_install.outcome == 'success' }}
        run: |
          umask 077
          .github/scripts/ci_env.sh 8080 > .env
          if grep -q change-me .env; then
            echo "::error::a placeholder secret of .env.example was left in .env"
            exit 1
          fi
          # Agents A2: the worker replays recorded streams instead of calling a model (refused
          # when APP_ENV is production; this stack is development).
          echo "AGENTS_FAKE_BACKEND=true" >> .env
      - name: Build the images (buildx bake, the runner's own layer cache)
        id: images
        if: ${{ !cancelled() && steps.e2e_env.outcome == 'success' && runner.environment != 'github-hosted' }}
        run: docker buildx bake --progress=plain -f compose.yml --load api worker caddy renderer
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        if: ${{ !cancelled() && steps.e2e_env.outcome == 'success' && runner.environment == 'github-hosted' }}
      # ignore-error: a failing cache service must not turn the journeys red (issue #35).
      - name: Build the images (buildx bake, GitHub Actions layer cache, written here)
        id: images_hosted
        if: ${{ !cancelled() && steps.e2e_env.outcome == 'success' && runner.environment == 'github-hosted' }}
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: compose.yml
          targets: api,worker,caddy,renderer
          load: true
          set: |
            api.cache-from=type=gha,scope=e2e-api
            worker.cache-from=type=gha,scope=e2e-worker
            caddy.cache-from=type=gha,scope=e2e-caddy
            api.cache-to=type=gha,scope=e2e-api,mode=max,ignore-error=true
            worker.cache-to=type=gha,scope=e2e-worker,mode=max,ignore-error=true
            caddy.cache-to=type=gha,scope=e2e-caddy,mode=max,ignore-error=true
      - name: Chromium for Playwright
        id: e2e_ready
        if: ${{ !cancelled() && (steps.images.outcome == 'success' || steps.images_hosted.outcome == 'success') }}
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      # Group identity. CI_COMPOSE_OVERLAY: see the checks job.
      - name: Start the stack and migrate (identity)
        id: identity_stack
        if: ${{ !cancelled() && steps.e2e_ready.outcome == 'success' }}
        run: |
          overlay=()
          if [[ -n "${CI_COMPOSE_OVERLAY:-}" ]]; then
            [[ -f "$CI_COMPOSE_OVERLAY" ]] || { echo "::error::the runner's CI_COMPOSE_OVERLAY names no file: $CI_COMPOSE_OVERLAY"; exit 1; }
            overlay=(-f "$CI_COMPOSE_OVERLAY")
            echo "compose overlay of this runner: $CI_COMPOSE_OVERLAY"
          fi
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml "${overlay[@]}" \
            up -d --no-build --wait --wait-timeout 300
          docker compose -p "$PROJECT" -f compose.yml exec -T api alembic upgrade head
      - name: Identity, invites, users, account, profile and throttle journeys
        id: e2e_identity
        if: ${{ !cancelled() && steps.identity_stack.outcome == 'success' }}
        working-directory: web
        timeout-minutes: 10
        env:
          E2E_ADMIN_EMAIL: e2e-admin@example.org
          E2E_PASSWORD_THROTTLE: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/identity
        run: pnpm exec playwright test -c e2e/identity-all.config.ts --reporter=list,html --output=test-results/identity
      - name: Stack logs (identity)
        id: identity_logs
        if: ${{ failure() && steps.identity_stack.outcome != 'skipped' }}
        run: |
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml ps -a
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml logs --no-color > "$RUNNER_TEMP/compose-identity.log" 2>&1 || true
      # Before the next group starts its own: the same project name and port. No `|| true`
      # here, unlike the last teardown of a job: the sweep group's fresh database rests on this
      # one having removed the identity stack and its volumes, so a teardown that fails fails
      # the job, and the sweep group does not start on what it left.
      - name: Tear down the scratch stack (identity)
        id: identity_down
        if: ${{ always() && steps.e2e_env.outcome == 'success' }}
        run: docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml down -v --remove-orphans --timeout 0

      # Group sweep, on a fresh stack: its own database and volumes. It starts only when the
      # teardown above succeeded, and looks for itself: no container and no volume of the
      # project may be left.
      - name: Start the stack and migrate (sweep)
        id: sweep_stack
        if: ${{ !cancelled() && steps.e2e_ready.outcome == 'success' && steps.identity_down.outcome == 'success' }}
        run: |
          left="$({ docker ps -aq --filter "label=com.docker.compose.project=$PROJECT"; docker volume ls -q --filter "label=com.docker.compose.project=$PROJECT"; } | tr '\n' ' ')"
          if [[ -n "$left" ]]; then
            echo "::error::containers or volumes of the identity stack are still here, the sweep group would not start on a fresh database: $left"
            exit 1
          fi
          overlay=()
          if [[ -n "${CI_COMPOSE_OVERLAY:-}" ]]; then
            [[ -f "$CI_COMPOSE_OVERLAY" ]] || { echo "::error::the runner's CI_COMPOSE_OVERLAY names no file: $CI_COMPOSE_OVERLAY"; exit 1; }
            overlay=(-f "$CI_COMPOSE_OVERLAY")
          fi
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml "${overlay[@]}" \
            up -d --no-build --wait --wait-timeout 300
          docker compose -p "$PROJECT" -f compose.yml exec -T api alembic upgrade head
      # Issue #11: Find jobs with live progress, the summary and failed boards, the history, the
      # schedule firing on the worker's tick, a 5,000 posting sweep under the worker's memory
      # limit; the spec's one real sweep is skipped here.
      - name: Sweep journeys against the fake ATS
        id: e2e_sweep
        if: ${{ !cancelled() && steps.sweep_stack.outcome == 'success' }}
        working-directory: web
        timeout-minutes: 8
        env:
          E2E_SKIP_REAL_SWEEP: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/sweep
        run: pnpm exec playwright test jobs-sweep.spec.ts --workers=1 --reporter=list,html --output=test-results/sweep
      - name: Stack logs (sweep)
        id: sweep_logs
        if: ${{ failure() && steps.sweep_stack.outcome != 'skipped' }}
        run: |
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml ps -a
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml logs --no-color > "$RUNNER_TEMP/compose-sweep.log" 2>&1 || true
      - name: Tear down the scratch stack (sweep)
        id: sweep_down
        if: ${{ always() && steps.e2e_env.outcome == 'success' }}
        run: docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml down -v --remove-orphans --timeout 0 || true
      - name: Upload Playwright report, traces, screenshots and logs
        id: upload
        if: ${{ failure() && steps.e2e_env.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-journeys-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/
            web/test-results/
            tasks/evidence/ci/
            ${{ runner.temp }}/compose-identity.log
            ${{ runner.temp }}/compose-sweep.log
          retention-days: 14
          if-no-files-found: ignore

      # As in the api job.
      - name: Runner memory
        id: memory
        if: ${{ always() }}
        run: |
          cg=/sys/fs/cgroup
          if [[ -r "$cg/memory.peak" && -r "$cg/memory.events" && "$(cat "$cg/memory.max")" =~ ^[0-9]+$ ]]; then
            {
              echo "### Runner memory (${RUNNER_NAME:-this runner}, since its container started)"
              echo
              echo "- limit $(($(cat "$cg/memory.max") / 1048576)) MB, highest use $(($(cat "$cg/memory.peak") / 1048576)) MB, file cache included"
              echo "- events: $(tr '\n' ' ' <"$cg/memory.events")"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no memory limit readable on this runner"
          fi

      - name: Every step the plan needs has run
        id: verify
        if: ${{ !cancelled() }}
        env:
          CI_LANE: journeys
          CI_PLAN: ${{ steps.plan.outputs.plan }}
          CI_JOB_STATUS: ${{ job.status }}
          CI_STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/ci_plan.py verify
