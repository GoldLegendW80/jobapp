# Continuous integration (SPEC-platform.md, Repository and automation; CONTRIBUTING.md).
# Every pull request and every push to main: api lint and tests against Postgres and Redis service
# containers (two shards, coverage combined and held to its floor in api-coverage), web lint,
# typecheck, Vitest and build, the shell scripts, the browser journeys against a scratch Compose
# stack built on the runner, and the pre-commit hooks not covered elsewhere.
# A green run on main is what .github/workflows/deploy.yml waits for.
#
# Exit codes: every run step uses `bash --noprofile --norc -eo pipefail`, through `shell: bash`
# in defaults.run (without it GitHub runs `bash -e`, where `gate | tail` ends with the status of
# tail). A job that sets its own defaults.run (a working-directory) must repeat `shell: bash`
# there: seen in run 38047794828, such a job did not inherit the workflow level shell.
# A command that gates anything is still never piped, and never negated with `!` (bash -e does
# not stop on a negated command): it runs on its own line or under an explicit `if`.
#
# Actions are pinned by full commit SHA (the tag in the comment). Tests only: the images that
# ship are built on the Jetson by the deploy workflow.
#
# Where it runs (issue #83): on the self-hosted runners of the owner's Mac, labels
# [self-hosted, mac-ci] (ops/ci-runners.sh, ops/ci-runner/: Linux arm64 containers in Docker
# Desktop, each with a Docker daemon of its own, so a job sees what it saw on a GitHub machine:
# `services:`, its own 127.0.0.1, its own container names and ports). Never [self-hosted] alone:
# the Jetson's deploy runner carries that label too.
# Load: the Mac is shared with its owner and with agents, so CI has a fixed budget there. Two
# runners, each pinned to 3 CPUs and 4 GB (ops/ci-runners.sh), are the limit on what runs at
# once, whatever the number of pushes: a runner takes one job, the rest queue. Worker counts are
# written out (PYTEST_WORKERS, VITEST_WORKERS below), never "all cores", and at most two e2e
# stacks of a run are up together (max-parallel in the e2e job).
# Escape hatch, back to GitHub's machines without editing this file:
#   gh variable set CI_RUNS_ON --body '"ubuntu-latest"'      and back: gh variable delete CI_RUNS_ON
# CI_RUNS_ON is the JSON of a runs-on value. Steps that differ test runner.environment
# ('github-hosted' or 'self-hosted'): caches go to GitHub's cache service there, and stay on the
# runner's disk here (uv, pnpm, Playwright and pre-commit through the runner's environment, image
# layers in the runner's own Docker daemon).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.9.28"
  NODE_VERSION: "22.23.3"
  FORCE_COLOR: "1"
  # Processes per test job: the 3 CPUs of a Mac runner. GitHub's machines have 2 to 4.
  PYTEST_WORKERS: "3"
  VITEST_WORKERS: "3"

jobs:
  # api tests in two shards on two runners, each with pytest-xdist (-n $PYTEST_WORKERS);
  # coverage is combined and checked (at least 95 percent) in api-coverage.
  api:
    name: api (${{ matrix.shard.name }})
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "mac-ci"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: jobs, paths: "tests/jobs" }
          - { name: rest, paths: "tests --ignore=tests/jobs" }
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: jobapp
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: jobapp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobapp -d jobapp_test -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        shell: bash
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://jobapp:ci-only-not-a-secret@127.0.0.1:5432/jobapp_test
      REDIS_URL: redis://127.0.0.1:6379/0
      COVERAGE_FILE: .coverage.${{ matrix.shard.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-glob: api/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint and format
        if: matrix.shard.name == 'rest'
        run: |
          uv run --frozen ruff check --output-format=github .
          uv run --frozen ruff format --check .
      # pytest-xdist: each worker on a database of its own created next to TEST_DATABASE_URL's
      # (tests/conftest.py); argon2 runs at a cheap cost in-process (tests/conftest.py
      # fast_argon2). The docker-marked tests run serially in the rest shard below.
      - name: Pytest (${{ matrix.shard.name }}), in parallel, coverage data only
        run: |
          start=$SECONDS
          # shellcheck disable=SC2086 # the paths of the shard split on purpose
          uv run --frozen pytest ${{ matrix.shard.paths }} -m "not docker" -p no:cacheprovider \
            -n "$PYTEST_WORKERS" --cov --cov-report= --cov-fail-under=0 --durations=10 \
            --junitxml=${{ runner.temp }}/junit-api.xml
          echo "pytest ${{ matrix.shard.name }} (not docker, -n $PYTEST_WORKERS): $((SECONDS - start))s wall" | tee -a "$RUNNER_TEMP/api-timings.txt"
      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.shard.name }}
          path: api/.coverage.${{ matrix.shard.name }}
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
          # "Re-run failed jobs" may run a shard whose upload already succeeded: replace it.
          overwrite: true
      # Serial, without -n: these stop, restart and pause Postgres containers of their own. No
      # --cov: they add nothing to the combined coverage figure (and never did).
      - name: Pytest, docker-marked (own Postgres containers stopped, restarted, paused)
        if: matrix.shard.name == 'rest'
        timeout-minutes: 10
        run: |
          start=$SECONDS
          uv run --frozen pytest -m docker -p no:cacheprovider \
            --junitxml=${{ runner.temp }}/junit-api-docker.xml
          echo "pytest (docker-marked, serial): $((SECONDS - start))s wall" | tee -a "$RUNNER_TEMP/api-timings.txt"
      # Issue #16: the scorer's speed bound without coverage tracing or other workers sharing the
      # cores, so it can be tight (0.3 s of CPU, the best of 3).
      - name: Pytest, scoring timing alone (no coverage, 0.3 s)
        if: matrix.shard.name == 'jobs'
        env:
          SCORE_BUDGET_S: "0.3"
        run: >-
          uv run --frozen pytest -p no:cacheprovider
          "tests/jobs/test_scoring.py::test_long_text_is_bounded_and_fast"
      - name: Test summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/api-timings.txt" ]]; then
            { echo "### api ${{ matrix.shard.name }} timings"; echo; sed 's/^/- /' "$RUNNER_TEMP/api-timings.txt"; echo; } >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 ../.github/scripts/junit_summary.py "api ${{ matrix.shard.name }}" "${{ runner.temp }}/junit-api.xml" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "${{ runner.temp }}/junit-api-docker.xml" ]]; then
            python3 ../.github/scripts/junit_summary.py "api (docker)" "${{ runner.temp }}/junit-api-docker.xml" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Runs whatever the shards did (always()), and fails when one of them did not succeed: a
  # skipped job would satisfy a required check, a failed one never does.
  api-coverage:
    name: api coverage (combined, at least 95 percent)
    needs: api
    if: always()
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "mac-ci"]') }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: api
    steps:
      - name: Both api shards succeeded
        if: needs.api.result != 'success'
        working-directory: ${{ github.workspace }}
        run: |
          echo "::error::the api shards ended with '${{ needs.api.result }}': coverage was not checked"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-glob: api/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
          path: api
      # Both files are named, so a missing shard fails here.
      - name: Combine the two shards
        id: combine
        run: uv run --frozen coverage combine .coverage.jobs .coverage.rest
      # The gate. Alone in its step and not piped: its exit status is the step's status.
      - name: Coverage floor (at least 95 percent of the combined data)
        run: uv run --frozen coverage report --fail-under=95
      # --fail-under=0: this step only reports, also when the floor above failed.
      - name: Coverage summary
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        run: |
          total="$(uv run --frozen coverage report --format=total --fail-under=0)"
          { echo "### api coverage"; echo; echo "- total: ${total} percent (floor: 95)"; } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: web checks (eslint, tsc, build)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "mac-ci"]') }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from packageManager in web/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  web-tests:
    name: web vitest (shard ${{ matrix.shard }}/2)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "mac-ci"]') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Vitest
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/2 --maxWorkers="$VITEST_WORKERS" --reporter=default --reporter=junit --outputFile=${{ runner.temp }}/junit-web.xml
      - name: Test summary
        if: always()
        run: python3 ../.github/scripts/junit_summary.py "web shard ${{ matrix.shard }}" "${{ runner.temp }}/junit-web.xml" >> "$GITHUB_STEP_SUMMARY"

  shell:
    name: shell (shellcheck, deploy.sh tests)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "mac-ci"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-glob: api/uv.lock
      - name: Shellcheck (pinned image, as tests/deploy_test.sh and pre-commit)
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0
          deploy.sh ops/db.sh ops/previous.sh ops/runner/entrypoint.sh ops/runner/job-guard.sh .github/scripts/ci_env.sh
          ops/ci-runners.sh ops/ci-runner/entrypoint.sh ops/ci-runner/job-started.sh
          ops/ci-runner/job-completed.sh ops/ci-runner/ci-clean.sh tests/ci_runners_test.sh
          tests/deploy_test.sh tests/jetson_smoke.sh tests/backup_test.sh tests/crash_check.sh
          tests/reboot_check.sh tests/e2e_jetson.sh tests/tailscale_test.sh tests/agents_real_run_jetson.sh
          tests/agents_real_run_test.sh
          ops/env_check.sh tests/env_check_test.sh
      # Issue #18: the .env syntax check and where it runs (deploy.sh, deploy.yml, the smoke).
      - name: tests/env_check_test.sh
        run: tests/env_check_test.sh
      # Every web/e2e/*.spec.ts is run by one e2e group or is excluded with a written reason.
      - name: e2e spec groups (.github/scripts/e2e_groups.py and its test)
        run: |
          python3 .github/scripts/e2e_groups_test.py
          python3 .github/scripts/e2e_groups.py
      # deploy.sh against fake ssh and docker: no Jetson, nothing remote.
      - name: tests/deploy_test.sh
        run: tests/deploy_test.sh
      # The operator script of A5 against a fake ssh: a dry run leaves the committed evidence
      # untouched, a real run never overwrites it, only the owner's subscription gets a run.
      - name: tests/agents_real_run_test.sh
        run: tests/agents_real_run_test.sh
      # Issue #83: the Mac CI runners (ops/ci-runners.sh and the hooks of ops/ci-runner) against
      # fake docker and gh, and where ci.yml and deploy.yml send their jobs.
      - name: tests/ci_runners_test.sh
        run: tests/ci_runners_test.sh
      # tailscale (Funnel): compose config and caddy's :8080 trust rules. No key, no tailnet; the
      # live no-key start is skipped here (CI is set, and the image is pinned to arm64).
      - name: tests/tailscale_test.sh
        run: tests/tailscale_test.sh

  # Browser journeys in three groups on three runners, each against its own scratch Compose stack
  # (on the Mac in the runner's own Docker daemon: the same project name and port in each);
  # the worker runs with TEST_FAST_TIMERS (tests/ats-stub.compose.yml). Every web/e2e/*.spec.ts
  # is in one group or in the exclusion list of .github/scripts/e2e_groups.py, which fails the
  # shell job otherwise.
  # Images: every group builds them with buildx bake from the GitHub Actions layer cache, and
  # only one group (cache_write) writes that cache, so the three runners do not export the same
  # mode=max layers three times. On a cold cache (a Dockerfile, a lock file or a base image
  # changed) the three still build in parallel. A single build job in front of the groups was
  # measured on 2026-10-10: it puts about 30 s (the job and its hand-over) before every group on
  # a warm cache, and on a cold one the groups still wait for the build, so it is never faster.
  e2e:
    name: e2e (${{ matrix.group }})
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "mac-ci"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # At most two stacks of one run at a time, also if a third runner is added.
      max-parallel: 2
      matrix:
        group: [identity, sweep, apps]
        include:
          - group: identity
            cache_write: true
    env:
      PROJECT: jobapp-ci
      E2E_CADDY_URL: http://127.0.0.1:8080
      E2E_COMPOSE_PROJECT: jobapp-ci
      E2E_EVIDENCE: ci
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-glob: api/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Environment of the scratch stack (random secrets, never committed)
        run: |
          umask 077
          .github/scripts/ci_env.sh 8080 > .env
          if grep -q change-me .env; then
            echo "::error::a placeholder secret of .env.example was left in .env"
            exit 1
          fi
          # Agents A2: the worker replays recorded streams instead of calling a model (refused
          # when APP_ENV is production; this stack is development).
          echo "AGENTS_FAKE_BACKEND=true" >> .env
      # On a Mac runner: the default builder of the runner's own Docker daemon, whose layer cache
      # stays on the runner's disk between jobs (bounded by the job-completed hook,
      # ops/ci-runner/ci-clean.sh). Nothing is uploaded or downloaded, and the runners do not
      # share it: each warms its own on its first e2e job.
      - name: Build the images (buildx bake, the runner's own layer cache)
        if: runner.environment != 'github-hosted'
        run: docker buildx bake --progress=plain -f compose.yml --load api worker caddy
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: runner.environment == 'github-hosted'
      # The cache-to lines are empty, and ignored, in the groups that do not write the cache.
      - name: Build the images (buildx bake, GitHub Actions layer cache)
        if: runner.environment == 'github-hosted'
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: compose.yml
          targets: api,worker,caddy
          load: true
          set: |
            api.cache-from=type=gha,scope=e2e-api
            worker.cache-from=type=gha,scope=e2e-worker
            caddy.cache-from=type=gha,scope=e2e-caddy
            ${{ matrix.cache_write && 'api.cache-to=type=gha,scope=e2e-api,mode=max' || '' }}
            ${{ matrix.cache_write && 'worker.cache-to=type=gha,scope=e2e-worker,mode=max' || '' }}
            ${{ matrix.cache_write && 'caddy.cache-to=type=gha,scope=e2e-caddy,mode=max' || '' }}
      # tests/ats-stub.compose.yml: the board check asks a stub (tests/ats_stub.py) and the worker
      # api/tests/jobs/fake_ats.py, never the real Ashby, Greenhouse or Lever.
      # CI_COMPOSE_OVERLAY comes from the runner's own environment, never from this file: the
      # Mac runners set it to compose.mac.yml (ops/ci-runner/Dockerfile), GitHub's machines and
      # the Jetson do not have it. Only `up` needs the overlay (compose.mac.yml).
      - name: Start the stack
        run: |
          overlay=()
          if [[ -n "${CI_COMPOSE_OVERLAY:-}" ]]; then
            [[ -f "$CI_COMPOSE_OVERLAY" ]] || { echo "::error::the runner's CI_COMPOSE_OVERLAY names no file: $CI_COMPOSE_OVERLAY"; exit 1; }
            overlay=(-f "$CI_COMPOSE_OVERLAY")
            echo "compose overlay of this runner: $CI_COMPOSE_OVERLAY"
          fi
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml "${overlay[@]}" \
            up -d --no-build --wait --wait-timeout 300
      - name: Migrations
        run: docker compose -p "$PROJECT" -f compose.yml exec -T api alembic upgrade head
      - name: Install web dependencies and Chromium
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Identity, invites, users, account, profile and throttle journeys
        if: matrix.group == 'identity'
        working-directory: web
        env:
          E2E_ADMIN_EMAIL: e2e-admin@example.org
          E2E_PASSWORD_THROTTLE: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/identity
        run: pnpm exec playwright test -c e2e/identity-all.config.ts --reporter=list,html
      # Issue #11: Find jobs with live progress, the summary and failed boards, the history, the
      # schedule firing on the worker's tick, a 5,000 posting sweep under the worker's memory
      # limit; the spec's one real sweep is skipped here.
      - name: Sweep journeys against the fake ATS
        if: matrix.group == 'sweep'
        working-directory: web
        env:
          E2E_SKIP_REAL_SWEEP: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/sweep
        run: pnpm exec playwright test jobs-sweep.spec.ts --workers=1 --reporter=list,html
      - name: Synthetic job folder (made-up rows, never Harald's data)
        if: matrix.group == 'apps'
        run: python3 .github/scripts/synthetic_jobs.py "$RUNNER_TEMP/synthetic/data"
      # Jobs on the synthetic import and the map; agents A2 to A4 on the fake backend (a run
      # streaming, reload and network loss, cancel, forbidden tools, triage proposals, job chat),
      # and the answer appearing while it is written (issue #33, partial messages replayed).
      - name: Jobs, map and agent journeys
        if: matrix.group == 'apps'
        working-directory: web
        env:
          E2E_JOBS_DATA: ${{ runner.temp }}/synthetic/data
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/apps
        run: >-
          pnpm exec playwright test jobs.spec.ts jobs-map.spec.ts agents-runs.spec.ts
          agents-triage.spec.ts agents-chat.spec.ts agents-streaming.spec.ts
          --workers=1 --reporter=list,html
      - name: Stack logs
        if: failure()
        run: |
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml ps -a
          docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml logs --no-color > "$RUNNER_TEMP/compose.log" 2>&1 || true
      - name: Upload Playwright report, traces, screenshots and logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/
            web/test-results/
            tasks/evidence/ci/
            ${{ runner.temp }}/compose.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Tear down the scratch stack
        if: always()
        run: docker compose -p "$PROJECT" -f compose.yml -f tests/ats-stub.compose.yml down -v --remove-orphans || true

  precommit:
    name: pre-commit (file fixers, gitleaks, prettier)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "mac-ci"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      # On a Mac runner pre-commit's environments stay on the runner (PRE_COMMIT_HOME).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # ruff runs in the api job, eslint in the web job, shellcheck in the shell job.
      - name: pre-commit run --all-files
        env:
          SKIP: ruff-check,ruff-format,eslint,shellcheck
        run: uvx --from pre-commit==4.6.2 pre-commit run --all-files --show-diff-on-failure
