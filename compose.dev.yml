# Development overrides for the Mac: dev image with test tools, code bind-mounted, uvicorn
# reloading on change, and ports published on 127.0.0.1 only (never on the LAN).
#   docker compose -f compose.yml -f compose.dev.yml up -d --build
# caddy runs as in production on http://localhost (HTTP_PORT), serving the last web build.
# For frontend hot reload run Vite outside Docker, it proxies /api to the api on 127.0.0.1:8000:
#   pnpm --dir web dev            # http://localhost:5173
# No public URL on the Mac: tailscale (Funnel) is in the `tunnel` profile of compose.yml, which only
# deploy.sh enables on the Jetson. Never pass --profile tunnel here unless you mean to publish.
# OPENSSL_armcap=0 on api and worker: without it `cryptography` dies with SIGILL at import inside
# Docker on an M4 (compose.mac.yml explains, and carries the same setting for stacks started from
# compose.yml alone). This file is never used on the Jetson, which keeps hardware AES.

services:
  api:
    build:
      context: ./api
      target: dev
    image: jobapp-api:dev
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - app
      - --reload-dir
      - alembic
    environment:
      OPENSSL_armcap: "0"
    volumes:
      - ./api/app:/app/app
      - ./api/alembic:/app/alembic
      - ./api/alembic.ini:/app/alembic.ini:ro
      - ./api/tests:/app/tests
      - ./api/pyproject.toml:/app/pyproject.toml:ro
    ports:
      - "127.0.0.1:8000:8000"

  # The worker on the dev target (every dependency group, the Claude Agent SDK included) with the
  # code bind-mounted (restart it to pick up changes). A tag of its own: two builds to one tag race.
  worker:
    build:
      context: ./api
      target: dev
    image: jobapp-worker:dev
    environment:
      OPENSSL_armcap: "0"
    volumes:
      - ./api/app:/app/app

  db:
    ports:
      - "127.0.0.1:5432:5432"
