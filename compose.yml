# Production stack. Local development adds compose.dev.yml:
#   docker compose -f compose.yml -f compose.dev.yml up --build
# On an Apple silicon Mac a stack started from this file alone adds compose.mac.yml, or the api and
# the worker die with SIGILL at import (OPENSSL_armcap=0, explained there). That variable never
# belongs in this file: the Jetson keeps hardware AES (api/tests/test_openssl_armcap.py).
#   docker compose -p jobapp-x -f compose.yml -f compose.mac.yml up -d --build --wait
# caddy is the only service that publishes a host port: ${HTTP_BIND}:${HTTP_PORT}, loopback by
# default, so the Jetson answers curl localhost over ssh and nothing on the LAN. Set HTTP_BIND=0.0.0.0
# in .env to open it to the LAN (ask first, SPEC-platform.md). The public entry point is Tailscale
# Funnel (service tailscale), which reaches caddy's unpublished tunnel listener http://caddy:8080
# over the Compose network (caddy/Caddyfile explains the two listeners).
#
# tailscale sits behind the `tunnel` profile, so nothing on the Mac joins the tailnet or opens a
# public URL by accident (the dev stack, the scratch stack of tests/compose_smoke.sh). deploy.sh
# enables it on the Jetson with --profile tunnel; by hand there:
#   docker compose -f compose.yml --profile tunnel up -d
#
# Service names reserved for later modules, so nothing else takes them:
#   web          name kept free: the React build ships inside the caddy image
#   browser      headed Chromium, Xvfb, noVNC (browser module)
#
# Networks: every service is on `default`, except `parser`, which is on `parsing` alone, an
# internal network (no gateway, no route out) that it shares with the worker and nobody else.
#
# Memory budget, 5G for the whole stack on the 7.4G Jetson (each service sets mem_limit):
#   api 512m, db 768m, redis 256m, caddy 128m, tailscale 128m, worker 1536m, parser 640m
#                                              this file: 3968m
#   browser 1536m                              reserved for the browser module
#   total 5504m with the browser module: over the 5G budget by about 380m. The parser's 640m is
#   a starting figure (ingestion G2a); G2b and G8 set it from the peaks they measure, and the
#   browser module decides its own limit against what is left when it is built.

name: jobapp

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    <<: *restart
    # Target `caddy` of web/Dockerfile: the React build baked into a caddy:2.x-alpine image.
    build:
      context: ./web
      target: caddy
      additional_contexts:
        caddy-config: ./caddy
    image: jobapp-caddy:latest
    depends_on:
      api:
        condition: service_started
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    mem_limit: 128m
    expose:
      - "8080"

  # --- tailscale (platform: Tailscale Funnel) ---------------------------------------------------
  # The public entry point: Tailscale Funnel, free, with a stable URL https://<TS_HOSTNAME>.<tailnet>
  # (https://jobapp.taild83d16.ts.net), which OAuth redirect URIs need. Outbound connections only,
  # no published port. Userspace networking: no /dev/net/tun, no NET_ADMIN, no capability at all.
  # TLS ends in this container (a Let's Encrypt certificate for the ts.net name, kept in the
  # state). tailscale/serve.json proxies HTTPS 443 to caddy's unpublished tunnel listener
  # http://caddy:8080 and opens it to the internet (AllowFunnel). Funnel sets X-Forwarded-For to
  # the visitor's address, replacing any value the visitor sent (caddy/Caddyfile).
  #
  # Login: TS_AUTHKEY (a one-time key from the admin console) is used on the first start only
  # (TS_AUTH_ONCE). The node key then lives in the `tsstate` volume, so restarts and redeploys
  # need no key: remove TS_AUTHKEY from the Jetson's .env after the first login. A new key is
  # only needed if tsstate is deleted or the node is removed from the tailnet.
  tailscale:
    <<: *restart
    # v1.102.5, the linux/arm64 manifest (its multi-arch index is
    # sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065).
    image: tailscale/tailscale:v1.102.5@sha256:472c549d2ef8cebc000de2c8a94061bbdc864d2454177b2ada713262475449ef
    platform: linux/arm64
    profiles: [tunnel]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-jobapp}
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tsstate:/var/lib/tailscale
      # The folder, not the file: rsync (deploy, and the rollback's restore-tree) replaces a
      # changed serve.json by rename, which a single-file bind mount would never see; through the
      # folder the running node reads the new file (containerboot watches it). An unchanged file
      # is not rewritten (rsync skips it), so a deploy or a rollback leaves the node alone.
      - ./tailscale:/config:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      caddy:
        condition: service_healthy
    # Healthy once logged in and connected (BackendState Running). Without a saved login and
    # without a valid key it stays NeedsLogin and never turns healthy, so a deploy fails loudly.
    # Any spacing around the colon is accepted (issue #18): a tailscale release that prints the
    # JSON compact must not turn a connected node unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json --peers=false | grep -Eq '\"BackendState\"[[:space:]]*:[[:space:]]*\"Running\"'"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 128m
  # --- end of tailscale ----------------------------------------------------------------------

  api:
    <<: *restart
    build:
      context: ./api
      target: runtime
    image: jobapp-api:latest
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 512m
    expose:
      - "8000"

  # --- worker (jobs J5, agents A2) -----------------------------------------------------------
  # Queue consumer (app/worker.py): board sweeps and the users' sweep schedules, and Claude agent
  # runs (SPEC-agents.md, at most 2 at a time). Its own image: the `worker` target of
  # api/Dockerfile, the api's code plus the Claude Agent SDK and the Claude Code CLI it bundles,
  # so the api image stays small. No port, no tunnel.
  worker:
    <<: *restart
    build:
      context: ./api
      target: worker
    image: jobapp-worker:latest
    command: ["python", "-m", "app.worker"]
    # Each agent run's scratch directory (Claude Code's HOME, config and temporary files) lives
    # here and is deleted when the run ends; in memory, counted in mem_limit, never on disk.
    tmpfs:
      - /tmp:size=128m,mode=1777
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthy while every queue's arq worker keeps its health record fresh in Redis (10 s).
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 3
    # A running sweep is failed as "interrupted" on SIGTERM; give it time to write that.
    stop_grace_period: 20s
    mem_limit: 1536m
    # `parsing`: the only way to the parser. The worker sends it a document and writes the
    # result to the database itself (app/ingestion/parser_client.py).
    networks:
      - default
      - parsing
  # --- end of worker --------------------------------------------------------------------------

  # --- parser (ingestion G2a; decision of the owner of 2026-10-10) ----------------------------
  # Every parser of an uploaded document (PDF, DOCX, archive, image) runs here and nowhere else:
  # parsers of hostile files are where exploits live, and the worker holds decrypted model
  # credentials during agent runs. So this service has nothing to steal and nowhere to go:
  # - the worker's image (no second image, no build of its own: the worker's build makes the
  #   tag, forward and on a rollback), started on app/ingestion/sandbox/server.py, which
  #   imports nothing of the application;
  # - its own uid, 10002 (the api and the worker are 10001), and its own PID namespace: no
  #   process, no /proc entry and no scratch directory of an agent run exists for it;
  # - no env_file: no CREDENTIALS_KEY, no SECRET_KEY, no database or Redis address, no model
  #   credential. Its environment is PARSER_PORT and what the image sets;
  # - `parsing` alone, an internal network: it cannot open a connection to db, redis, the api
  #   or the internet, cannot resolve an outside name, and only the worker can reach it;
  # - no capability, no new privilege, a read only root, no volume, no tmpfs, and `ipc: none`,
  #   which takes away /dev/shm, the one place Docker leaves writable in a read only container;
  # - at most 32 processes and threads, 640m of memory.
  # Inside it each document is parsed by a child process of its own under resource limits and a
  # seccomp deny list (app/ingestion/sandbox/main.py). The healthcheck starts such a child and
  # is healthy only when that child reports the filter refusing every denied call and every
  # limit at its value: without the filter the service is unhealthy and a deploy rolls back.
  # Never give it an env_file, a volume, a second network or a published port.
  parser:
    <<: *restart
    image: jobapp-worker:latest
    pull_policy: never  # built above by the worker, never pulled
    command: ["python", "-I", "/app/app/ingestion/sandbox/server.py"]
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ipc: none
    pids_limit: 32
    environment:
      PARSER_PORT: "7070"
    networks:
      - parsing
    healthcheck:
      test: ["CMD", "python", "-I", "/app/app/ingestion/sandbox/server.py", "--check"]
      interval: 15s
      timeout: 8s
      start_period: 10s
      retries: 3
    mem_limit: 640m
    expose:
      - "7070"
  # --- end of parser --------------------------------------------------------------------------

  db:
    <<: *restart
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 10
    shm_size: 128m
    mem_limit: 768m
    expose:
      - "5432"

  redis:
    <<: *restart
    image: redis:7.4.11-alpine
    # Queue between api and worker: persist every write (AOF) and never evict a job.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    mem_limit: 256m
    expose:
      - "6379"

networks:
  # The worker and the parser, and nothing else. internal: no gateway, so no route to another
  # network or to the internet, and Docker's resolver answers for this network's names only.
  parsing:
    internal: true

volumes:
  pgdata:
  redisdata:
  # tailscale: the node's login, key and Funnel certificate. Never delete it on the Jetson, or the
  # next start needs a fresh TS_AUTHKEY.
  tsstate:
