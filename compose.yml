# Production stack. Local development adds compose.dev.yml:
#   docker compose -f compose.yml -f compose.dev.yml up --build
# caddy is the only service that publishes a host port: ${HTTP_BIND}:${HTTP_PORT}, loopback by
# default, so the Jetson answers curl localhost over ssh and nothing on the LAN. Set HTTP_BIND=0.0.0.0
# in .env to open it to the LAN (ask first, SPEC-platform.md). The public entry point is the
# cloudflared quick tunnel, which reaches caddy's unpublished tunnel listener http://caddy:8080 over
# the Compose network (caddy/Caddyfile explains the two listeners).
#
# cloudflared sits behind the `tunnel` profile, so nothing on the Mac opens a public tunnel by
# accident (the dev stack, the scratch stack of tests/compose_smoke.sh). deploy.sh enables it on the
# Jetson with --profile tunnel; by hand there: docker compose -f compose.yml --profile tunnel up -d
#
# Service names reserved for later modules, so nothing else takes them:
#   web          name kept free: the React build ships inside the caddy image
#   browser      headed Chromium, Xvfb, noVNC (browser module)
#
# Memory budget, 5G for the whole stack on the 7.4G Jetson (each service sets mem_limit):
#   api 512m, db 768m, redis 256m, caddy 128m, cloudflared 128m, worker 1536m  this file: 3328m
#   browser 1536m                              reserved for the browser module
#   total 4864m, leaving about 250m of headroom inside the 5G budget

name: jobapp

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    <<: *restart
    # Target `caddy` of web/Dockerfile: the React build baked into a caddy:2.x-alpine image.
    build:
      context: ./web
      target: caddy
      additional_contexts:
        caddy-config: ./caddy
    image: jobapp-caddy:latest
    depends_on:
      api:
        condition: service_started
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    mem_limit: 128m
    expose:
      - "8080"

  # Cloudflare quick tunnel: free, no account, no domain. The https://<random>.trycloudflare.com
  # URL changes every time the container starts; ./deploy.sh url reads the current one from the
  # logs of the current start. Outbound connections only, no published port.
  cloudflared:
    <<: *restart
    image: cloudflare/cloudflared:2026.9.3
    profiles: [tunnel]
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:20241
      - --url
      - http://caddy:8080
    depends_on:
      caddy:
        condition: service_healthy
    # The image is distroless (no shell, no curl): cloudflared asks its own /ready endpoint, which
    # answers 200 once at least one connection to the Cloudflare edge is up.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 128m

  api:
    <<: *restart
    build:
      context: ./api
      target: runtime
    image: jobapp-api:latest
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 512m
    expose:
      - "8000"

  # --- worker (jobs J5) ----------------------------------------------------------------------
  # Queue consumer: board sweeps and the users' sweep schedules today (app/worker.py), Claude agent
  # runs later (SPEC-agents.md). Same image as the api, another command; no port, no tunnel.
  worker:
    <<: *restart
    # The api's image, built by the api service (two builds to one tag would race); never pulled.
    image: jobapp-api:latest
    pull_policy: never
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthy while every queue's arq worker keeps its health record fresh in Redis (10 s).
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 3
    # A running sweep is failed as "interrupted" on SIGTERM; give it time to write that.
    stop_grace_period: 20s
    mem_limit: 1536m
  # --- end of worker --------------------------------------------------------------------------

  db:
    <<: *restart
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 10
    shm_size: 128m
    mem_limit: 768m
    expose:
      - "5432"

  redis:
    <<: *restart
    image: redis:7.4.11-alpine
    # Queue between api and worker: persist every write (AOF) and never evict a job.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    mem_limit: 256m
    expose:
      - "6379"

volumes:
  pgdata:
  redisdata:
