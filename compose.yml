# Production stack. Local development adds compose.dev.yml:
#   docker compose -f compose.yml -f compose.dev.yml up --build
# On an Apple silicon Mac a stack started from this file alone adds compose.mac.yml, or the api and
# the worker die with SIGILL at import (OPENSSL_armcap=0, explained there). That variable never
# belongs in this file: the Jetson keeps hardware AES (api/tests/test_openssl_armcap.py).
#   docker compose -p jobapp-x -f compose.yml -f compose.mac.yml up -d --build --wait
# caddy is the only service that publishes a host port: ${HTTP_BIND}:${HTTP_PORT}, loopback by
# default, so the Jetson answers curl localhost over ssh and nothing on the LAN. Set HTTP_BIND=0.0.0.0
# in .env to open it to the LAN (ask first, SPEC-platform.md). The public entry point is Tailscale
# Funnel (service tailscale), which reaches caddy's unpublished tunnel listener http://caddy:8080
# over the Compose network (caddy/Caddyfile explains the two listeners).
#
# tailscale sits behind the `tunnel` profile, so nothing on the Mac joins the tailnet or opens a
# public URL by accident (the dev stack, the scratch stack of tests/compose_smoke.sh). deploy.sh
# enables it on the Jetson with --profile tunnel; by hand there:
#   docker compose -f compose.yml --profile tunnel up -d
#
# Service names reserved for later modules, so nothing else takes them:
#   web          name kept free: the React build ships inside the caddy image
#
# The browser (browser module) sits behind the `browser` profile, like tailscale behind `tunnel`:
# a stack started without it has no headed Chromium. Its own stacks and tests start it with
# --profile browser; deploy.sh starts it on the Jetson once the host firewall of its `egress`
# network is installed and checked (ops/browser-egress.sh, B6), and stops it otherwise.
# It has no restart policy: after a reboot of the Jetson it stays down until the next deploy, which
# checks the firewall first (owner decision of 2026-10-14); the rest of the stack restarts as usual.
#
# Networks: every service is on `default`, except `parser`, which is on `parsing` alone,
# `renderer`, which is on `rendering` alone (two internal networks, no gateway, no route out,
# each shared with the worker and nobody else), and `browser`, which is on `browsing` (internal,
# shared with the api, the worker and caddy, which reach its control API and live view) and
# `egress` (its own, the one network with a route out that no other service joins).
#
# Memory budget, 5G for the whole stack on the 7.4G Jetson (each service sets mem_limit):
#   api 512m, db 768m, redis 256m, caddy 128m, tailscale 128m, worker 1536m, parser 640m,
#   renderer 256m, browser 1024m              this file: 5248m
#   5248m is 128m over the 5G budget (5120m). The renderer went from 384m to 256m with the
#   browser (D3 measured a peak of 134 MiB on the Jetson); the parser's 640m is a starting figure
#   (ingestion G2a) that G2b and G8 set from the peaks they measure: the parser at 512m brings
#   the stack to 5120m. The browser's 1024m is B1's measure (a Workday stand in with 3 tabs
#   peaked at 499 MiB in the cgroup, 807 MiB of PSS), so its memory guard closes a tab at about
#   920 MiB. (SPEC-platform.md, SPEC-documents.md "Rendering on the Jetson", SPEC-browser.md.)
#   The optional mail profile adds a separately limited 128m provider: 5376m total, 256m above
#   the unchanged 5120m target. These declared limits do not prove physical Jetson capacity;
#   docs/mail-application-setup.md records the fixture measurement and pending acceptance.

name: jobapp

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    <<: *restart
    # Target `caddy` of web/Dockerfile: the React build baked into a caddy:2.x-alpine image whose
    # caddy is built with the free rate limit module (caddy-ratelimit, issue #152).
    build:
      context: ./web
      target: caddy
      additional_contexts:
        caddy-config: ./caddy
    image: jobapp-caddy:latest
    depends_on:
      api:
        condition: service_started
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    mem_limit: 128m
    expose:
      - "8080"
    # `browsing`: the live view's websocket to the browser (B4, /vnc/).
    networks:
      - default
      - browsing

  # --- tailscale (platform: Tailscale Funnel) ---------------------------------------------------
  # The public entry point: Tailscale Funnel, free, with a stable URL https://<TS_HOSTNAME>.<tailnet>
  # (https://jobapp.taild83d16.ts.net), which OAuth redirect URIs need. Outbound connections only,
  # no published port. Userspace networking: no /dev/net/tun, no NET_ADMIN, no capability at all.
  # TLS ends in this container (a Let's Encrypt certificate for the ts.net name, kept in the
  # state). tailscale/serve.json proxies HTTPS 443 to caddy's unpublished tunnel listener
  # http://caddy:8080 and opens it to the internet (AllowFunnel). Funnel sets X-Forwarded-For to
  # the visitor's address, replacing any value the visitor sent (caddy/Caddyfile).
  #
  # Login: TS_AUTHKEY (a one-time key from the admin console) is used on the first start only
  # (TS_AUTH_ONCE). The node key then lives in the `tsstate` volume, so restarts and redeploys
  # need no key: remove TS_AUTHKEY from the Jetson's .env after the first login. A new key is
  # only needed if tsstate is deleted or the node is removed from the tailnet.
  tailscale:
    <<: *restart
    # v1.102.5, the linux/arm64 manifest (its multi-arch index is
    # sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065).
    image: tailscale/tailscale:v1.102.5@sha256:472c549d2ef8cebc000de2c8a94061bbdc864d2454177b2ada713262475449ef
    platform: linux/arm64
    profiles: [tunnel]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-jobapp}
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tsstate:/var/lib/tailscale
      # The folder, not the file: rsync (deploy, and the rollback's restore-tree) replaces a
      # changed serve.json by rename, which a single-file bind mount would never see; through the
      # folder the running node reads the new file (containerboot watches it). An unchanged file
      # is not rewritten (rsync skips it), so a deploy or a rollback leaves the node alone.
      - ./tailscale:/config:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      caddy:
        condition: service_healthy
    # Healthy once logged in and connected (BackendState Running). Without a saved login and
    # without a valid key it stays NeedsLogin and never turns healthy, so a deploy fails loudly.
    # Any spacing around the colon is accepted (issue #18): a tailscale release that prints the
    # JSON compact must not turn a connected node unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json --peers=false | grep -Eq '\"BackendState\"[[:space:]]*:[[:space:]]*\"Running\"'"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 128m
  # --- end of tailscale ----------------------------------------------------------------------

  api:
    <<: *restart
    build:
      context: ./api
      target: runtime
    image: jobapp-api:latest
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 512m
    expose:
      - "8000"
    # `browsing`: the api is browserd's client for leases (app/browser/client.py, B3).
    networks:
      - default
      - browsing
      - mailmcp

  # Gmail read transport, started only after the deployment checks its host firewall.
  # No stack env_file, database, OAuth refresh token, or model credential.
  gmailmcp:
    profiles: [mail]
    restart: "no"
    image: jobapp-api:latest
    command: ["python", "-m", "app.gmailmcp"]
    environment:
      APP_ENV: production
      GMAIL_MCP_URL: http://gmailmcp:9400/mcp
    networks: [mailmcp, gmail_egress]
    mem_limit: 128m
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9400/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  # --- worker (jobs J5, agents A2) -----------------------------------------------------------
  # Queue consumer (app/worker.py): board sweeps and the users' sweep schedules, and Claude agent
  # runs (SPEC-agents.md, at most 2 at a time). Its own image: the `worker` target of
  # api/Dockerfile, the api's code plus the Claude Agent SDK and the Claude Code CLI it bundles,
  # so the api image stays small. No port, no tunnel.
  worker:
    <<: *restart
    build:
      context: ./api
      target: worker
    image: jobapp-worker:latest
    command: ["python", "-m", "app.worker"]
    # Each agent run's scratch directory (Claude Code's HOME, config and temporary files) lives
    # here and is deleted when the run ends; in memory, counted in mem_limit, never on disk.
    tmpfs:
      - /tmp:size=128m,mode=1777
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthy while every queue's arq worker keeps its health record fresh in Redis (10 s).
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 3
    # A running sweep is failed as "interrupted" on SIGTERM; give it time to write that.
    stop_grace_period: 20s
    mem_limit: 1536m
    # `parsing`: the only way to the parser. The worker sends it a document and writes the
    # result to the database itself (app/ingestion/parser_client.py).
    # `rendering`: the only way to the renderer (app/documents/render_client.py).
    # `browsing`: browserd's tool API for agent runs (B5).
    networks:
      - default
      - parsing
      - rendering
      - browsing
      - mailmcp
  # --- end of worker --------------------------------------------------------------------------

  # --- parser (ingestion G2a; decision of the owner of 2026-10-10) ----------------------------
  # Every parser of an uploaded document (PDF, DOCX, archive, image) runs here and nowhere else:
  # parsers of hostile files are where exploits live, and the worker holds decrypted model
  # credentials during agent runs. So this service has nothing to steal and nowhere to go:
  # - the worker's image (no second image, no build of its own: the worker's build makes the
  #   tag, forward and on a rollback), started on app/ingestion/sandbox/server.py, which
  #   imports nothing of the application;
  # - its own uid, 10002 (the api and the worker are 10001), and its own PID namespace: no
  #   process, no /proc entry and no scratch directory of an agent run exists for it;
  # - no env_file: no CREDENTIALS_KEY, no SECRET_KEY, no database or Redis address, no model
  #   credential. Its environment is PARSER_PORT and what the image sets;
  # - `parsing` alone, an internal network: it cannot open a connection to db, redis, the api
  #   or the internet, cannot resolve an outside name, and only the worker can reach it;
  # - no capability, no new privilege, a read only root, no volume, no tmpfs, and `ipc: none`,
  #   which takes away /dev/shm, the one place Docker leaves writable in a read only container;
  # - at most 32 processes and threads, 640m of memory.
  # Inside it each document is parsed by a child process of its own under resource limits and a
  # seccomp deny list (app/ingestion/sandbox/main.py). The healthcheck starts such a child and
  # is healthy only when that child reports the filter refusing every denied call and every
  # limit at its value: without the filter the service is unhealthy and a deploy rolls back.
  # Never give it an env_file, a volume, a second network or a published port.
  parser:
    <<: *restart
    image: jobapp-worker:latest
    pull_policy: never  # built above by the worker, never pulled
    command: ["python", "-I", "/app/app/ingestion/sandbox/server.py"]
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ipc: none
    pids_limit: 32
    environment:
      PARSER_PORT: "7070"
    networks:
      - parsing
    healthcheck:
      test: ["CMD", "python", "-I", "/app/app/ingestion/sandbox/server.py", "--check"]
      interval: 15s
      timeout: 8s
      start_period: 10s
      retries: 3
    mem_limit: 640m
    expose:
      - "7070"
  # --- end of parser --------------------------------------------------------------------------

  # --- renderer (documents D3; the engine D1 measured and chose on the Jetson) -----------------
  # One HTML page in, one A4 PDF out: Playwright's Chromium headless shell behind
  # renderer/server.py, one warm browser, a fresh context per render with JavaScript off and
  # every request but a data: address aborted. The HTML holds what a person wrote, so this
  # service gets nothing else and reaches nothing:
  # - its own image, its own uid, 10003; no env_file and no environment: no secret, no database
  #   or Redis address, no credential; it takes an HTML body and nothing else;
  # - `rendering` alone, an internal network shared with the worker only, no published port;
  # - no capability, no new privilege, a read only root, `ipc: none` (Chromium runs with
  #   --disable-dev-shm-usage), Docker's default seccomp profile;
  # - Chromium runs with --no-sandbox: its own sandbox needs user namespaces, which the default
  #   seccomp profile and no-new-privileges refuse (D1). The container is the boundary. Never
  #   add a capability, `seccomp=unconfined` or `privileged` to start Chromium's sandbox;
  # - a 64m tmpfs on /tmp: Playwright and Chromium write there, and fail with EROFS without it;
  # - at most 128 processes and threads (D1 measured a peak of 71; 32 kills it), 256m of memory
  #   (D1's peak 157 MiB; D3 measured 50 renders on the Jetson, a peak of 134 MiB,
  #   SPEC-documents.md; lowered from 384m for the browser's budget, B2).
  # A render longer than 30 s is stopped and its context closed, else the browser is killed and
  # launched again; a crash of the service is a restart.
  # Never give it an env_file, an environment, a volume, a second network or a published port.
  renderer:
    <<: *restart
    build:
      context: ./renderer
    image: jobapp-renderer:latest
    command: ["python", "-I", "/renderer/server.py"]
    user: "10003:10003"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ipc: none
    pids_limit: 128
    networks:
      - rendering
    healthcheck:
      test: ["CMD", "python", "-I", "/renderer/server.py", "--check"]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 3
    mem_limit: 256m
    expose:
      - "7071"
  # --- end of renderer ------------------------------------------------------------------------

  # --- browser (browser B2; B1 measured it on the Jetson) -------------------------------------
  # One headed Chromium at a time for a person's lease, driven by browserd (browser/browserd/):
  # the control API on :9300, the profile of each person on the volume `browserprofiles`. It
  # loads real job sites, hostile JavaScript included, while holding the person's logins, so:
  # - its own image; browserd is root with SETUID and SETGID only, to start each person's
  #   Chromium under that profile's own uid (20000 and up, mode 0700 directories); every other
  #   capability dropped, no new privilege, a read only root with tmpfs for /tmp and /leases;
  # - Chromium's own sandbox stays on (never --no-sandbox): browser/seccomp.json is Docker's
  #   default profile plus what Chromium's user namespace sandbox needs (B1, narrowed by B6):
  #   clone and unshare of user, PID and network namespaces only, and chroot; no capability;
  # - no env_file: no SECRET_KEY, CREDENTIALS_KEY, database or Redis address, model credential.
  #   Its environment is APP_ENV, its own control secret and its timers;
  # - `browsing` (internal) for its control API, and `egress`, its own network with a route out.
  #   Every connection of Chromium goes through browserd's proxy, which refuses any address that
  #   is not public (private, loopback, link local and metadata, CGNAT and the tailnet, ULA), so
  #   a page cannot reach the app's services on `browsing`, the LAN or the Docker host; the host
  #   firewall drops the same from the `egress` bridge (ops/browser-egress.sh, B6). Not on
  #   `default`: db, redis and the api's name do not resolve there. No published port;
  # - 1024m of memory and as much with swap (memswap_limit equal: no swap, a fast OOM kill),
  #   128m of /dev/shm (B1: Chromium used none of it), 1024 processes and threads.
  # SIGTERM releases the lease and closes Chromium cleanly (the profile is flushed) within 15 s.
  # Never give it an env_file, a published port, `default`, a capability or `unconfined`.
  browser:
    # Not `unless-stopped`: a daemon start after a reboot must not bring the browser up before the
    # deploy has checked the host firewall (ops/browser-egress.sh deploy starts it).
    restart: "no"
    profiles: [browser]
    build:
      context: ./browser
    image: jobapp-browser:latest
    command: ["python", "-m", "browserd"]
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /leases:size=64m,mode=1733
    volumes:
      - browserprofiles:/profiles
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
      - seccomp=./browser/seccomp.json
    pids_limit: 1024
    environment:
      # Only to refuse a test setting under production (BROWSER_PROXY_ALLOW_PRIVATE, B6).
      APP_ENV: ${APP_ENV:-}
      BROWSER_CONTROL_SECRET: ${BROWSER_CONTROL_SECRET:-}
      BROWSER_LEASE_MAX_S: ${BROWSER_LEASE_MAX_S:-}
      BROWSER_IDLE_S: ${BROWSER_IDLE_S:-300}
      BROWSER_SESSION_MAX_S: ${BROWSER_SESSION_MAX_S:-1800}
      BROWSER_MEM_GUARD_PCT: ${BROWSER_MEM_GUARD_PCT:-90}
    networks:
      - browsing
      - egress
    healthcheck:
      test: ["CMD", "python", "-m", "browserd", "--check"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 15s
    shm_size: 128m
    mem_limit: 1024m
    memswap_limit: 1024m
    expose:
      - "9300"
  # --- end of browser -------------------------------------------------------------------------

  db:
    <<: *restart
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 10
    shm_size: 128m
    mem_limit: 768m
    expose:
      - "5432"

  redis:
    <<: *restart
    image: redis:7.4.11-alpine
    # Queue between api and worker: persist every write (AOF) and never evict a job.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    mem_limit: 256m
    expose:
      - "6379"

networks:
  mailmcp:
    internal: true
  gmail_egress: {}
  # The worker and the parser, and nothing else. internal: no gateway, so no route to another
  # network or to the internet, and Docker's resolver answers for this network's names only.
  parsing:
    internal: true
  # The worker and the renderer, and nothing else, internal for the same reasons.
  rendering:
    internal: true
  # browserd's control API and live view: the browser, the api, the worker and caddy.
  browsing:
    internal: true
  # The browser's way out, its own: no other service joins it. ops/browser-egress.sh (B6) drops
  # its traffic to private, link local and CGNAT ranges, the host and UDP but DNS on the host
  # (DOCKER-USER, INPUT); browserd's proxy refuses them too.
  egress: {}

volumes:
  pgdata:
  redisdata:
  # tailscale: the node's login, key and Funnel certificate. Never delete it on the Jetson, or the
  # next start needs a fresh TS_AUTHKEY.
  tsstate:
  # browser: one directory per person (mode 0700, the profile's uid): logins as cookies and local
  # storage. Not encrypted at rest (SPEC-browser), kept out of the nightly backup (B6) and of any
  # dump, deleted with the account or by "Forget all logins" (B3 queues it, B7 removes it).
  browserprofiles:
