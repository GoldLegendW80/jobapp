# Hooks run on every commit. Install once with: pre-commit install
# Hooks scoped to api/ or web/ are skipped until those folders hold matching files.
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # At a commit: the staged changes (the hook's own entry, gitleaks git --pre-commit --staged).
      - id: gitleaks
      # In CI nothing is staged, so the hook above reads nothing there: a committed secret
      # passed `pre-commit run --all-files` (shown on 2026-10-11, review of #93). CI runs this
      # one instead, by its name and stage, and so can anyone:
      #   pre-commit run gitleaks-commits --hook-stage manual
      # The same program at the same version with the same rules, given the commits of the pull
      # request or of the push to read (.github/scripts/secret_scan.sh). Never at a commit.
      - id: gitleaks
        alias: gitleaks-commits
        name: Detect hardcoded secrets in the commits of a run (CI)
        entry: .github/scripts/secret_scan.sh
        stages: [manual]
        always_run: true
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier (web/)
        language: node
        additional_dependencies: [prettier@3.9.9]
        entry: prettier --write --ignore-unknown
        files: ^web/
        # The lockfile is written by pnpm and must stay byte for byte as pnpm writes it.
        exclude: ^web/pnpm-lock\.yaml$
        types: [text]

      # Uses the eslint config and plugins installed in web/node_modules.
      # Skipped with a notice until web/ has its dependencies installed (pnpm --dir web install).
      - id: eslint
        name: eslint (web/)
        language: system
        files: ^web/.*\.(js|jsx|ts|tsx|mjs|cjs)$
        entry: >-
          bash -c 'if [ ! -x web/node_modules/.bin/eslint ]; then
          echo "eslint not installed in web/node_modules, skipped"; exit 0; fi;
          files=(); for f in "$@"; do files+=("${f#web/}"); done;
          pnpm --dir web exec eslint --max-warnings=0 "${files[@]}"' --

      # Every web/e2e/*.spec.ts is in an e2e group of ci.yml or excluded with a reason.
      - id: e2e-groups
        name: e2e spec groups (ci.yml)
        language: system
        entry: python3 .github/scripts/e2e_groups.py
        files: ^(web/e2e/.*\.(spec|config)\.ts|\.github/workflows/ci\.yml|\.github/scripts/e2e_groups\.py)$
        pass_filenames: false

      # The path rules of the CI plan, the reasons that let a rule skip a unit, and that the
      # steps of ci.yml follow the plan (issue #91).
      - id: ci-plan
        name: CI plan (ci.yml follows ci_plan.py)
        language: system
        entry: python3 .github/scripts/ci_plan_test.py
        files: ^(\.github/workflows/ci\.yml|\.github/scripts/ci_plan(_test)?\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false

  # deploy.sh and the scripts that test it. tests/compose_smoke.sh predates the hook and still
  # has info-level findings (SC2015, SC2046, SC2086), so it is not listed yet.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^(deploy\.sh|ops/(db|previous|migrate|env_check|local-check|deploy-checked|ship|card|dev-setup)\.sh|ops/runner/(entrypoint|job-guard)\.sh|ops/ci-(runners|rerun)\.sh|ops/ci-runner/(entrypoint|job-started|job-completed|ci-clean)\.sh|\.github/scripts/(ci_env|secret_scan)\.sh|tests/(local_check_test|ship_test|dev_setup_test|ci_runners_test|secret_scan_test|deploy_test|migrate_test|env_check_test|jetson_smoke|backup_test|crash_check|reboot_check|e2e_jetson|tailscale_test|ingestion_parser_jetson|ingestion_transcribe_jetson)\.sh)$
