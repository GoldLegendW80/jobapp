# Hooks run on every commit. Install once with: pre-commit install
# Hooks scoped to api/ or web/ are skipped until those folders hold matching files.
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier (web/)
        language: node
        additional_dependencies: [prettier@3.9.9]
        entry: prettier --write --ignore-unknown
        files: ^web/
        # The lockfile is written by pnpm and must stay byte for byte as pnpm writes it.
        exclude: ^web/pnpm-lock\.yaml$
        types: [text]

      # Uses the eslint config and plugins installed in web/node_modules.
      # Skipped with a notice until web/ has its dependencies installed (pnpm --dir web install).
      - id: eslint
        name: eslint (web/)
        language: system
        files: ^web/.*\.(js|jsx|ts|tsx|mjs|cjs)$
        entry: >-
          bash -c 'if [ ! -x web/node_modules/.bin/eslint ]; then
          echo "eslint not installed in web/node_modules, skipped"; exit 0; fi;
          files=(); for f in "$@"; do files+=("${f#web/}"); done;
          pnpm --dir web exec eslint --max-warnings=0 "${files[@]}"' --

  # deploy.sh and the scripts that test it. tests/compose_smoke.sh predates the hook and still
  # has info-level findings (SC2015, SC2046, SC2086), so it is not listed yet.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^(deploy\.sh|ops/(db|previous|env_check)\.sh|ops/runner/(entrypoint|job-guard)\.sh|\.github/scripts/ci_env\.sh|tests/(deploy_test|env_check_test|jetson_smoke|backup_test|crash_check|reboot_check|e2e_jetson|tailscale_test)\.sh)$
